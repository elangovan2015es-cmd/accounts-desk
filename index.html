<style>
:root{
  --bg:#FFF6EC; --panel:#FFFBF6; --accent:#FFE2C2; --accent2:#FFCF9E; --line:#F2B880;
  --ink:#141414; --ink2:#3A2A1A; --brand:#C2560C; --ok:#0B6B2E; --okbg:#DDF3E3;
  --warn:#7A4A00; --warnbg:#FFF0C2; --bad:#9B1C1C; --badbg:#FFE0DC; --info:#123C73; --infobg:#E3EEFF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans","Noto Sans Tamil",system-ui,sans-serif;font-weight:600;font-size:15px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:800;color:var(--ink)}
h2{font-size:20px} h3{font-size:16px}
a{color:var(--brand);font-weight:800}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{display:flex;align-items:center;gap:8px}
.logo b{font-size:18px;font-weight:800}
.logo small{display:block;font-size:12px;color:var(--ink2)}
.grow{flex:1}
select,input,textarea{font:inherit;font-weight:600;color:var(--ink);background:#FFFDF9;border:2px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:90px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--accent2);border-color:var(--brand)}
button{font:inherit;font-weight:800;color:var(--ink);background:var(--accent);border:2px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer}
button:hover{background:var(--accent2)}
button.primary{background:var(--accent2);border-color:var(--brand)}
button.primary:hover{background:#FFB86E}
button.danger{background:var(--badbg);border-color:#E7A49B;color:var(--bad)}
button.small{padding:4px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:2px solid var(--line);background:var(--panel);position:sticky;top:58px;z-index:19}
nav button{white-space:nowrap;background:transparent;border-color:transparent}
nav button.on{background:var(--accent2);border-color:var(--brand)}
main{max-width:1180px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:800}
label.f input,label.f select{width:100%}
.muted{color:var(--ink2);font-size:13px}
ul.tight{margin:6px 0;padding-left:20px} ul.tight li{margin:2px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1.5px solid var(--accent2);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--accent);font-weight:800}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;border:1.5px solid}
.p-ok{background:var(--okbg);color:var(--ok);border-color:#9FD5AE}
.p-warn{background:var(--warnbg);color:var(--warn);border-color:#E8C96A}
.p-bad{background:var(--badbg);color:var(--bad);border-color:#E7A49B}
.p-info{background:var(--infobg);color:var(--info);border-color:#A9C3EE}
.p-n{background:var(--accent);color:var(--ink);border-color:var(--line)}
.kpi{background:var(--accent);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi span{font-size:13px;color:var(--ink2)}
.chk{margin:4px 0;padding:6px 9px;border-radius:8px;font-size:13.5px}
.chk.ok{background:var(--okbg);color:var(--ok)} .chk.warn{background:var(--warnbg);color:var(--warn)} .chk.bad{background:var(--badbg);color:var(--bad)} .chk.info{background:var(--infobg);color:var(--info)}
.drop{border:3px dashed var(--brand);border-radius:14px;padding:26px;text-align:center;background:var(--accent);cursor:pointer}
.drop.hot{background:var(--accent2)}
.task{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;background:#FFFDF9}
.datebox{text-align:center;border-radius:10px;padding:5px 0;background:var(--accent);border:2px solid var(--line)}
.datebox b{display:block;font-size:22px;line-height:1}
.datebox span{font-size:11px;font-weight:800}
.datebox.late{background:var(--badbg);border-color:#E7A49B;color:var(--bad)}
.datebox.soon{background:var(--warnbg);border-color:#E8C96A;color:var(--warn)}
.datebox.done{background:var(--okbg);border-color:#9FD5AE;color:var(--ok)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink2);color:#FFF6EC;padding:10px 16px;border-radius:10px;font-weight:800;display:none;z-index:99;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(40,20,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:3px solid var(--brand);border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.lock{font-size:40px;line-height:1}
.billhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.lines input{width:100%}
.vch td{font-size:13px}
.sep{height:2px;background:var(--accent2);margin:12px 0;border:0}
.banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
svg text{font-family:"Noto Sans",sans-serif;font-weight:800}
@media (max-width:640px){ nav{top:96px} .task{grid-template-columns:54px 1fr} .task .acts{grid-column:1/-1} }
</style>

<body>
<header>
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="#FFCF9E" stroke="#C2560C" stroke-width="2"/><path d="M9 11h16M9 17h16M9 23h10" stroke="#141414" stroke-width="3" stroke-linecap="round"/></svg>
    <div><b>Kaveri Accounts Desk</b><small>Bills → Tally → GST &amp; TDS</small></div>
  </div>
  <div class="grow"></div>
  <label class="row" style="gap:6px"><span class="muted">Company</span><select id="coSel"></select></label>

</header>

<input type="file" id="b2bIn" accept=".json" hidden>
<input type="file" id="restoreIn" accept=".json" hidden>

<script>
/*CORE-START*/
// ---------- pure helpers (tested offline) ----------
const STATES={"01":"Jammu and Kashmir","02":"Himachal Pradesh","03":"Punjab","04":"Chandigarh","05":"Uttarakhand","06":"Haryana","07":"Delhi","08":"Rajasthan","09":"Uttar Pradesh","10":"Bihar","11":"Sikkim","12":"Arunachal Pradesh","13":"Nagaland","14":"Manipur","15":"Mizoram","16":"Tripura","17":"Meghalaya","18":"Assam","19":"West Bengal","20":"Jharkhand","21":"Odisha","22":"Chhattisgarh","23":"Madhya Pradesh","24":"Gujarat","26":"Dadra and Nagar Haveli and Daman and Diu","27":"Maharashtra","29":"Karnataka","30":"Goa","31":"Lakshadweep","32":"Kerala","33":"Tamil Nadu","34":"Puducherry","35":"Andaman and Nicobar Islands","36":"Telangana","37":"Andhra Pradesh","38":"Ladakh","97":"Other Territory"};
const QRMP_GROUP1=["22","23","24","25","26","27","29","30","31","32","33","34","35","36","37"];
const GST_RATES=[0,3,5,12,18,28,40];
const r2=x=>Math.round((+x||0)*100)/100;
const fmt=x=>(+x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const xesc=esc;
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const invNorm=s=>String(s||'').toUpperCase().replace(/\d+/g,n=>n.replace(/^0+(?=\d)/,'')).replace(/[^A-Z0-9]/g,'');

function gstinValid(g){
  g=String(g||'').toUpperCase().trim();
  if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return false;
  const cs='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let sum=0;
  for(let i=0;i<14;i++){ const v=cs.indexOf(g[i])*(i%2?2:1); sum+=Math.floor(v/36)+(v%36); }
  return cs[(36-(sum%36))%36]===g[14];
}
function stateOf(gstin){ const c=String(gstin||'').slice(0,2); return STATES[c]?c:''; }

// GST + TDS due-date calendar. y,m = the month in which tasks fall due (m 1-12).
function dueTasks(co,y,m){
  const out=[]; const d=(dd,mm=m,yy=y)=>{const x=new Date(yy,mm-1,1); const last=new Date(yy,mm,0).getDate(); return new Date(yy,mm-1,Math.min(dd,last));};
  const pm=m===1?12:m-1, py=m===1?y-1:y; const per=`${py}-${String(pm).padStart(2,'0')}`;
  const mn=n=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][n-1];
  const perLabel=`${mn(pm)} ${py}`;
  const qEnd=[3,6,9,12].includes(pm); const qLabel=()=>{const s=pm-2; return `${mn(s)}–${mn(pm)} ${py}`;};
  if(co.gstin){
    if((co.gstFreq||'monthly')==='monthly'){
      out.push({key:`GSTR1_${per}`,kind:'gst',title:'GSTR-1 (outward supplies)',period:perLabel,due:d(11),portal:'gst'});
      out.push({key:`GSTR3B_${per}`,kind:'gst',title:'GSTR-3B (summary + tax payment)',period:perLabel,due:d(20),portal:'gst'});
    } else {
      if(qEnd){
        const grp=co.qrmpDay||(QRMP_GROUP1.includes(stateOf(co.gstin))?22:24);
        out.push({key:`GSTR1Q_${per}`,kind:'gst',title:'GSTR-1 quarterly (QRMP)',period:qLabel(),due:d(13),portal:'gst'});
        out.push({key:`GSTR3BQ_${per}`,kind:'gst',title:'GSTR-3B quarterly (QRMP)',period:qLabel(),due:d(grp),portal:'gst'});
      } else {
        out.push({key:`IFF_${per}`,kind:'gst',title:'IFF – B2B invoices (optional, QRMP)',period:perLabel,due:d(13),portal:'gst',optional:true});
        out.push({key:`PMT06_${per}`,kind:'gst',title:'PMT-06 – monthly GST payment (QRMP)',period:perLabel,due:d(25),portal:'gst'});
      }
    }
  }
  if(co.tan){
    // TDS deposit: 7th of next month; March deductions by 30 April
    out.push({key:`TDSPAY_${per}`,kind:'tds',title:'TDS deposit (challan)',period:perLabel,due:pm===3?d(30):d(7),portal:'it'});
    const retMap={7:[6,'Q1 (Apr–Jun)'],10:[9,'Q2 (Jul–Sep)'],1:[12,'Q3 (Oct–Dec)'],5:[3,'Q4 (Jan–Mar)']};
    if(retMap[m]){
      const [qm,ql]=retMap[m]; const qy=m===1?y-1:y; const fy=qm<=3?qy-1:qy;
      const lastMonthOfQ = new Date(qy,qm-1,1); const isNew = lastMonthOfQ>=new Date(2026,3,1);
      const forms=isNew?'Form 140 (non-salary) / Form 138 (salary)':'Form 26Q (non-salary) / Form 24Q (salary)';
      out.push({key:`TDSRET_${qy}-${String(qm).padStart(2,'0')}`,kind:'tds',title:`TDS return ${ql} – ${forms}`,period:`${ql} FY ${fy}-${String((fy+1)%100).padStart(2,'0')}`,due:d(31),portal:'it'});
    }
    const certMap={8:[6,'Q1'],11:[9,'Q2'],2:[12,'Q3'],6:[3,'Q4']};
    if(certMap[m]){
      const [qm,ql]=certMap[m]; const qy=m===2?y-1:y;
      out.push({key:`TDSCERT_${qy}-${String(qm).padStart(2,'0')}`,kind:'tds',title:`TDS certificates to parties – ${ql}`,period:`${ql}`,due:d(15),portal:'traces'});
    }
  }
  return out.map(t=>({...t,dueISO:isoDate(t.due)}));
}
function isoDate(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}

// Totals and checks for one bill against a company.
function billCalc(b){
  const lines=b.lines||[];
  const taxable=r2(lines.reduce((s,l)=>s+(+l.taxable||0),0));
  const cgst=r2(lines.reduce((s,l)=>s+(+l.cgst||0),0));
  const sgst=r2(lines.reduce((s,l)=>s+(+l.sgst||0),0));
  const igst=r2(lines.reduce((s,l)=>s+(+l.igst||0),0));
  const cess=r2(lines.reduce((s,l)=>s+(+l.cess||0),0));
  const ro=r2(b.roundOff||0);
  const computed=r2(taxable+cgst+sgst+igst+cess+ro);
  const tds=b.tds&&b.tds.on?r2(Math.round((+b.tds.base||taxable)*(+b.tds.rate||0)/100)):0;
  return {taxable,cgst,sgst,igst,cess,ro,computed,total:r2(b.total||computed),tds,party:r2((b.total||computed)-tds)};
}
function billChecks(b,co,ledgerSet,otherBills){
  const c=billCalc(b), out=[]; const add=(lvl,msg)=>out.push({lvl,msg});
  if(!b.supplierName) add('bad','Supplier name missing');
  if(!b.invoiceNo) add('bad','Invoice number missing');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(b.invoiceDate||'')) add('bad','Invoice date missing or unclear');
  else { const dt=new Date(b.invoiceDate); if(dt>new Date()) add('bad','Invoice date is in the future'); }
  if(b.supplierGSTIN){
    if(!gstinValid(b.supplierGSTIN)) add('bad',`Supplier GSTIN ${b.supplierGSTIN} fails the GSTIN check-digit test – re-read it`);
    else add('ok','Supplier GSTIN format and check digit OK');
    const sc=stateOf(b.supplierGSTIN), cc=stateOf(co.gstin);
    if(sc&&cc){
      if(sc===cc && c.igst>0) add('bad','Same-state supplier but IGST charged – should be CGST + SGST');
      if(sc!==cc && (c.cgst>0||c.sgst>0)) add('bad','Other-state supplier but CGST/SGST charged – should be IGST');
    }
  } else if(c.cgst+c.sgst+c.igst>0) add('bad','GST charged but supplier GSTIN missing – no input credit without it');
  else add('info','Unregistered supplier / no GST on bill');
  (b.lines||[]).forEach((l,i)=>{
    const rt=+l.rate||0, tx=+l.taxable||0, tax=(+l.cgst||0)+(+l.sgst||0)+(+l.igst||0);
    if(Math.abs(tax-tx*rt/100)>Math.max(1,lines_tol(tx))) add('warn',`Line ${i+1}: tax ${fmt(tax)} ≠ ${rt}% of ${fmt(tx)} (${fmt(tx*rt/100)})`);
    if(Math.abs((+l.cgst||0)-(+l.sgst||0))>0.5) add('bad',`Line ${i+1}: CGST and SGST are not equal`);
    if(!GST_RATES.includes(rt)) add('warn',`Line ${i+1}: unusual GST rate ${rt}%`);
  });
  if(Math.abs(c.computed-c.total)>1) add('bad',`Bill total ${fmt(c.total)} ≠ taxable + tax + round-off ${fmt(c.computed)}`);
  else add('ok','Totals add up');
  if(Math.abs(c.ro)>1) add('warn',`Round-off ${fmt(c.ro)} is more than ₹1`);
  const dup=(otherBills||[]).find(o=>o.id!==b.id && invNorm(o.invoiceNo)===invNorm(b.invoiceNo) && (norm(o.supplierGSTIN)===norm(b.supplierGSTIN)) && norm(o.supplierName).slice(0,6)===norm(b.supplierName).slice(0,6));
  if(dup) add('bad',`Possible duplicate: same supplier & invoice no. already entered (${dup.status})`);
  if(ledgerSet && ledgerSet.size){
    const pl=b.partyLedger||b.supplierName;
    if(!ledgerSet.has(norm(pl))) add('warn',`Party ledger “${pl}” not in Tally list – it will be created under Sundry Creditors`);
    (b.lines||[]).forEach((l,i)=>{ if(l.ledger && !ledgerSet.has(norm(l.ledger))) add('bad',`Line ${i+1}: ledger “${l.ledger}” not found in Tally`); });
    taxLedgers(b,co).forEach(n=>{ if(!ledgerSet.has(norm(n))) add('bad',`Tax ledger “${n}” not found in Tally`); });
    if(b.tds&&b.tds.on&&b.tds.ledger&&!ledgerSet.has(norm(b.tds.ledger))) add('bad',`TDS ledger “${b.tds.ledger}” not found in Tally`);
  } else add('warn','Tally ledger list not loaded for this company – ledger names not checked');
  (b.lines||[]).forEach((l,i)=>{ if(!l.ledger) add('bad',`Line ${i+1}: choose the purchase/expense ledger`); });
  if(b.tds&&b.tds.on){ if(!b.tds.ledger) add('bad','TDS ticked but TDS ledger not chosen'); if(!(+b.tds.rate>0)) add('bad','TDS ticked but rate missing'); }
  if(/^\d{4}-\d{2}-\d{2}$/.test(b.invoiceDate||'')){
    const dt=new Date(b.invoiceDate); const fyEnd=dt.getMonth()>=3?dt.getFullYear()+1:dt.getFullYear();
    const itcLast=new Date(fyEnd,10,30); if(new Date()>itcLast && (c.cgst+c.igst)>0) add('warn','ITC time limit (30 Nov after the financial year) may have passed for this bill');
  }
  return out;
}
function lines_tol(tx){return tx*0.002;}
function rateMap(co,rate){ return (co.rateLedgers||{})[rate]||{}; }
function taxLedgers(b,co){
  const s=new Set(); (b.lines||[]).forEach(l=>{ const m=rateMap(co,+l.rate||0);
    if(+l.cgst) s.add(m.cgst||co.cgstLedger||'Input CGST'); if(+l.sgst) s.add(m.sgst||co.sgstLedger||'Input SGST'); if(+l.igst) s.add(m.igst||co.igstLedger||'Input IGST'); if(+l.cess) s.add(co.cessLedger||'Input Cess'); });
  if(+b.roundOff) s.add(co.roundOffLedger||'Round Off');
  return [...s];
}
// Ledger entries: debit = negative amount + ISDEEMEDPOSITIVE Yes; credit = positive + No.
function voucherEntries(b,co){
  const c=billCalc(b), E=[]; const agg={};
  const put=(name,amt)=>{ if(!name||!r2(amt)) return; agg[name]=r2((agg[name]||0)+amt); };
  (b.lines||[]).forEach(l=>{ const m=rateMap(co,+l.rate||0);
    put(l.ledger,+l.taxable);
    put(m.cgst||co.cgstLedger||'Input CGST',+l.cgst); put(m.sgst||co.sgstLedger||'Input SGST',+l.sgst); put(m.igst||co.igstLedger||'Input IGST',+l.igst); put(co.cessLedger||'Input Cess',+l.cess); });
  if(c.ro) put(co.roundOffLedger||'Round Off',c.ro);
  const party=b.partyLedger||b.supplierName;
  E.push({ledger:party,dr:0,cr:c.party,party:true});
  if(c.tds) E.push({ledger:b.tds.ledger,dr:0,cr:c.tds});
  Object.entries(agg).forEach(([n,a])=>{ if(a>0) E.push({ledger:n,dr:a,cr:0}); else E.push({ledger:n,dr:0,cr:-a}); });
  const dr=r2(E.reduce((s,e)=>s+e.dr,0)), cr=r2(E.reduce((s,e)=>s+e.cr,0));
  return {entries:E,dr,cr,balanced:Math.abs(dr-cr)<0.01};
}
function tallyXML(bills,co,ledgerSet,opts={}){
  const ymd=s=>String(s||'').replace(/-/g,'');
  const amt=n=>r2(n).toFixed(2);
  let msgs='';
  if(opts.createParties!==false){
    const seen=new Set();
    bills.forEach(b=>{ const p=b.partyLedger||b.supplierName; const k=norm(p);
      if(seen.has(k)|| (ledgerSet&&ledgerSet.has(k))) return; seen.add(k);
      const st=STATES[stateOf(b.supplierGSTIN)]||STATES[stateOf(co.gstin)]||'';
      msgs+=`<TALLYMESSAGE xmlns:UDF="TallyUDF"><LEDGER NAME="${xesc(p)}" ACTION="Create"><NAME.LIST><NAME>${xesc(p)}</NAME></NAME.LIST><PARENT>${xesc(co.creditorGroup||'Sundry Creditors')}</PARENT><ISBILLWISEON>Yes</ISBILLWISEON>${b.supplierGSTIN?`<GSTREGISTRATIONTYPE>Regular</GSTREGISTRATIONTYPE><PARTYGSTIN>${xesc(b.supplierGSTIN)}</PARTYGSTIN>`:`<GSTREGISTRATIONTYPE>Unregistered</GSTREGISTRATIONTYPE>`}${st?`<LEDSTATENAME>${xesc(st)}</LEDSTATENAME><STATENAME>${xesc(st)}</STATENAME>`:''}<COUNTRYNAME>India</COUNTRYNAME></LEDGER></TALLYMESSAGE>\n`; });
  }
  bills.forEach(b=>{
    const v=voucherEntries(b,co); const vt=b.voucherType||co.purchaseVchType||'Purchase';
    const party=b.partyLedger||b.supplierName; const c=billCalc(b);
    const st=STATES[stateOf(b.supplierGSTIN)]||'';
    let le='';
    v.entries.forEach(e=>{
      const isDr=e.dr>0; const a=isDr?-e.dr:e.cr;
      le+=`<ALLLEDGERENTRIES.LIST><LEDGERNAME>${xesc(e.ledger)}</LEDGERNAME><ISDEEMEDPOSITIVE>${isDr?'Yes':'No'}</ISDEEMEDPOSITIVE>${e.party?'<ISPARTYLEDGER>Yes</ISPARTYLEDGER>':''}<AMOUNT>${amt(a)}</AMOUNT>${e.party?`<BILLALLOCATIONS.LIST><NAME>${xesc(b.invoiceNo)}</NAME><BILLTYPE>New Ref</BILLTYPE><AMOUNT>${amt(a)}</AMOUNT></BILLALLOCATIONS.LIST>`:''}</ALLLEDGERENTRIES.LIST>`;
    });
    const narr=`Bill ${b.invoiceNo} dt ${b.invoiceDate} – ${b.supplierName}${b.narration?' – '+b.narration:''} [KAD:${b.id}]`;
    msgs+=`<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="${xesc(vt)}" ACTION="Create" OBJVIEW="Accounting Voucher View"><DATE>${ymd(b.postDate||b.invoiceDate)}</DATE><EFFECTIVEDATE>${ymd(b.postDate||b.invoiceDate)}</EFFECTIVEDATE><VOUCHERTYPENAME>${xesc(vt)}</VOUCHERTYPENAME><REFERENCE>${xesc(b.invoiceNo)}</REFERENCE><REFERENCEDATE>${ymd(b.invoiceDate)}</REFERENCEDATE><PARTYLEDGERNAME>${xesc(party)}</PARTYLEDGERNAME>${b.supplierGSTIN?`<PARTYGSTIN>${xesc(b.supplierGSTIN)}</PARTYGSTIN>`:''}${st?`<STATENAME>${xesc(st)}</STATENAME><PLACEOFSUPPLY>${xesc(STATES[stateOf(co.gstin)]||st)}</PLACEOFSUPPLY>`:''}<PERSISTEDVIEW>Accounting Voucher View</PERSISTEDVIEW><ISINVOICE>No</ISINVOICE><NARRATION>${xesc(narr)}</NARRATION>${le}</VOUCHER></TALLYMESSAGE>\n`;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME><STATICVARIABLES><SVCURRENTCOMPANY>${xesc(co.tallyName||co.name)}</SVCURRENTCOMPANY></STATICVARIABLES></REQUESTDESC><REQUESTDATA>\n${msgs}</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>\n`;
}
// GSTR-2B JSON → flat invoices
function parse2B(j){
  const root=j?.data?.docdata||j?.docdata||j?.data||j; const b2b=root?.b2b||[]; const out=[];
  b2b.forEach(s=>{ (s.inv||[]).forEach(iv=>{ const it=iv.items||iv.itms||[]; let tx=0,ig=0,cg=0,sg=0;
    it.forEach(x=>{const d=x.itm_det||x; tx+=+d.txval||0; ig+=+d.igst||+d.iamt||0; cg+=+d.cgst||+d.camt||0; sg+=+d.sgst||+d.samt||0;});
    if(!it.length){tx=+iv.txval||0; ig=+iv.igst||0; cg=+iv.cgst||0; sg=+iv.sgst||0;}
    out.push({gstin:s.ctin,name:s.trdnm||'',inv:iv.inum,dt:iv.dt,val:+iv.val||0,txval:r2(tx),tax:r2(ig+cg+sg),itcavl:iv.itcavl}); }); });
  return out;
}
function match2B(bills,b2b){
  const key=(g,i)=>String(g||'').toUpperCase()+'|'+invNorm(i);
  const bm=new Map(); bills.forEach(b=>bm.set(key(b.supplierGSTIN,b.invoiceNo),b));
  const matched=[],only2b=[],seen=new Set();
  b2b.forEach(r=>{ const k=key(r.gstin,r.inv); const b=bm.get(k);
    if(b){ seen.add(k); const c=billCalc(b); const diff=r2((c.cgst+c.sgst+c.igst)-r.tax); matched.push({b,r,diff}); } else only2b.push(r); });
  const onlyBooks=bills.filter(b=>b.supplierGSTIN && !seen.has(key(b.supplierGSTIN,b.invoiceNo)));
  return {matched,only2b,onlyBooks};
}

const Store={mode:'local',db:null,subs:[],mem:{},

async function fileToImages(file){
  const imgs=[];
  const toJpeg=async(src,w,h)=>{ const scale=Math.min(1,1800/Math.max(w,h)); const cv=document.createElement('canvas'); cv.width=Math.round(w*scale); cv.height=Math.round(h*scale); cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height); return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85)); };
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error('PDF reader did not load');
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let p=1;p<=Math.min(pdf.numPages,3);p++){ const pg=await pdf.getPage(p); const vp=pg.getViewport({scale:2}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; imgs.push(await toJpeg(cv,cv.width,cv.height)); }
  } else {
    const bmp=await createImageBitmap(file); imgs.push(await toJpeg(bmp,bmp.width,bmp.height));
  }
  return imgs;
}
const PROMPT=c=>`You read Indian purchase/expense bills (tax invoices) for accounting. The buyer is "${c.name}" (GSTIN ${c.gstin||'n/a'}).
Read the attached bill image(s) – one bill, possibly several pages. Reply with ONLY a JSON object, no other text:
{"supplierName":"","supplierGSTIN":"","invoiceNo":"","invoiceDate":"YYYY-MM-DD","buyerGSTIN":"","placeOfSupply":"",
 "lines":[{"description":"short summary","hsn":"","rate":18,"taxable":0,"cgst":0,"sgst":0,"igst":0,"cess":0}],
 "roundOff":0,"total":0,"isService":false,"tdsHint":"none|contract|professional|rent|commission|purchase|other","confidence":"high|medium|low","notes":"anything unclear"}
Rules: group items by GST rate – one line per rate with summed taxable value and tax. Amounts are numbers in rupees, no commas. Dates in Indian bills are day-month-year. If a value is not on the bill use "" or 0 and say so in notes. Never guess a GSTIN – copy it exactly or leave it blank.`;
async function readQueue(){
  const c=co(); if(!c) return;
  for(const q of S.queue){ if(q.state!=='wait') continue;
    q.state='busy'; q.note='preparing'; render();
    try{
      const imgs=await fileToImages(q.file); q.note='AI reading'; render();
      if(!Store.ai) throw new Error('AI reading not available here'); if(!Store.aiImages) throw new Error('Image reading not enabled here');
      const res=await Store.ai(PROMPT(c),{images:imgs,modelTier:'default'});
      const t=res.text||''; const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
      await addBillFromAI(j,q.name); q.state='done';
    }catch(e){ q.state='err'; q.err=e.code==='rate_limited'?'Busy – try again in a minute':e.code==='not_granted'?'Permission not given':(e.message||'Could not read').slice(0,80); if(e.code==='rate_limited'){render(); break;} }
    render();
  }
}
function guessLedger(c,rate,isService){
  const m=rateMap(c,rate); if(m.purchase) return m.purchase;
  return isService?(c.defaultExpense||''):(c.defaultPurchase||'');
}
function findLedger(name){ const n=norm(name); if(!n) return ''; const exact=S.ledgers.find(l=>norm(l)===n); if(exact) return exact; const part=S.ledgers.find(l=>norm(l).includes(n.slice(0,10))||n.includes(norm(l))&&norm(l).length>5); return part||''; }
async function addBillFromAI(j,src){
  const c=co(); const id=uid();
  const tdsMap=(c.tdsMap||{})[j.tdsHint]||null;
  const b={cid:c.id,status:'draft',createdAt:new Date().toISOString(),source:src,supplierName:String(j.supplierName||'').trim(),supplierGSTIN:String(j.supplierGSTIN||'').toUpperCase().replace(/\s/g,''),invoiceNo:String(j.invoiceNo||'').trim(),invoiceDate:j.invoiceDate||'',
    lines:(j.lines||[]).map(l=>({description:l.description||'',hsn:l.hsn||'',rate:+l.rate||0,taxable:r2(l.taxable),cgst:r2(l.cgst),sgst:r2(l.sgst),igst:r2(l.igst),cess:r2(l.cess),ledger:guessLedger(c,+l.rate||0,j.isService)})),
    roundOff:r2(j.roundOff),total:r2(j.total),aiNotes:[j.confidence?`AI confidence: ${j.confidence}`:'',j.notes||''].filter(Boolean).join(' · '),
    voucherType:j.isService&&tdsMap?(c.journalVchType||'Journal'):(c.purchaseVchType||'Purchase'),
    tds:{on:!!(tdsMap&&j.tdsHint&&j.tdsHint!=='none'),section:tdsMap?.section||'',rate:tdsMap?.rate||'',ledger:tdsMap?.ledger||'',base:0}};
  if(!b.lines.length) b.lines=[{description:'',hsn:'',rate:18,taxable:0,cgst:0,sgst:0,igst:0,cess:0,ledger:''}];
  b.partyLedger=findLedger(b.supplierName)||b.supplierName;

  await Store.set('bills',id,b); await logIt(`Bill read: ${b.supplierName} #${b.invoiceNo}`);
}

const saveTimers={};
function onBillInput(el){
  const b=S.bills.find(x=>x.id===el.dataset.bill); if(!b) return; const k=el.dataset.k;
  let val=el.type==='checkbox'?el.checked:el.value;
  const num=['rate','taxable','cgst','sgst','igst','cess','roundOff','total','tds.rate','tds.base'].includes(k);
  if(num && val!=='' ) val=+String(val).replace(/,/g,'')||0;
  if(el.dataset.line!==undefined){ b.lines[+el.dataset.line][k]=val; }
  else if(k.startsWith('tds.')){ b.tds=b.tds||{}; b.tds[k.slice(4)]=val; if(k==='tds.section'){ const m=Object.values(c_tds()).find(t=>t.section===val); if(m){b.tds.rate=b.tds.rate||m.rate; b.tds.ledger=b.tds.ledger||m.ledger;} } }
  else b[k]=k==='supplierGSTIN'?String(val).toUpperCase():val;
  S.editing=b.id; clearTimeout(saveTimers[b.id]);
  saveTimers[b.id]=setTimeout(async()=>{ S.editing=null; const {id,...rest}=b; await Store.set('bills',b.id,rest); if(Store.mode!=='cloud') render(); else rerenderCard(b); },700);

}

  if(!c.tan) return `<div class="card"><h2>TDS</h2><p>Add the TAN in Company setup to use this tab.</p></div>`;
  const pb=periodBills(c,S.month).filter(b=>b.tds&&b.tds.on);
  const bySec={}; pb.forEach(b=>{const k=b.tds.section||'(no section)'; const t=billCalc(b).tds; const o=bySec[k]=bySec[k]||{n:0,base:0,tds:0}; o.n++; o.base+=+b.tds.base||billCalc(b).taxable; o.tds+=t;});
  const tot=Object.values(bySec).reduce((s,o)=>s+o.tds,0);
  const [y,m]=S.month.split('-').map(Number); const nx=m===12?[y+1,1]:[y,m+1];
  const tasks=[...dueTasks(c,nx[0],nx[1]),...dueTasks(c,y,m)].filter(t=>t.kind==='tds').map(t=>({...t,st:S.tasks[t.key]||null}));
  const uniq=[...new Map(tasks.map(t=>[t.key,t])).values()];
  return `<div class="card"><div class="billhead"><h2>TDS – ${esc(c.short||c.name)}</h2>${monthPicker()}</div><p class="muted">TAN ${esc(c.tan)} · from bills approved in this app. Salary TDS is not covered here – take it from payroll.</p></div>
  <div class="card"><h3>TDS deducted – ${S.month}</h3>${pb.length?`<div class="grid3" style="margin-bottom:10px">${Object.entries(bySec).map(([k,o])=>`<div class="kpi"><b>₹${fmt(o.tds)}</b><span>${esc(k)} · ${o.n} bill(s)</span></div>`).join('')}<div class="kpi" style="background:var(--accent2)"><b>₹${fmt(tot)}</b><span>Challan total to deposit</span></div></div>
   ${miniTable(pb.map(b=>{const k=billCalc(b); return [b.invoiceDate,b.supplierName,b.supplierGSTIN?b.supplierGSTIN.slice(2,12):'(PAN?)',b.tds.section,fmt(+b.tds.base||k.taxable),b.tds.rate+'%',fmt(k.tds)];}),['Date','Party','PAN (from GSTIN)','Section','Amount paid/credited','Rate','TDS'])}
   <p class="muted">PAN is taken from characters 3–12 of the GSTIN. For parties without GSTIN, get the PAN separately.</p><div class="row"><button data-act="tdsCsv">Download TDS register (CSV)</button><button data-act="tdsQCsv">Download quarter register (CSV)</button></div>`:'<p class="muted">No bills with TDS this month.</p>'}</div>
  <div class="card"><h3>TDS deposit &amp; returns</h3>${uniq.map(t=>taskRow(t,c)).join('')||'<p class="muted">None this period.</p>'}<p class="muted">From 1 April 2026 the Income-tax Act, 2025 applies: quarterly returns are on Form 140 (non-salary) and Form 138 (salary) with new section references. Returns for periods before April 2026 stay on 26Q/24Q.</p></div>`;
}

// ---------- calendar ----------
function vCal(){
  const [y,m]=S.month.split('-').map(Number);
  const rows=S.companies.flatMap(cmp=>dueTasks(cmp,y,m).filter(t=>t.dueISO>=(cmp.trackFrom||'')).map(t=>{ const st=taskStatus(cmp.id,t); if(st&&st.dueOverride) t.dueOverride=st.dueOverride; return {t:{...t,st},cmp}; })).sort((a,b)=>(a.t.dueOverride||a.t.dueISO).localeCompare(b.t.dueOverride||b.t.dueISO));
  const days=new Date(y,m,0).getDate(); const first=new Date(y,m-1,1).getDay();
  let cells=''; for(let i=0;i<first;i++) cells+='<div></div>';
  for(let d=1;d<=days;d++){ const iso=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const here=rows.filter(r=>(r.t.dueOverride||r.t.dueISO)===iso); const allDone=here.length&&here.every(r=>r.t.st&&r.t.st.status==='filed');
    cells+=`<div style="min-height:54px;border:2px solid var(--line);border-radius:8px;padding:3px 5px;background:${here.length?(allDone?'var(--okbg)':'var(--accent2)'):'#FFFDF9'}"><b>${d}</b>${here.length?`<div style="font-size:11px">${here.map(r=>esc((r.cmp.short||'').slice(0,6)+' '+r.t.title.split(' ')[0])).join('<br>')}</div>`:''}</div>`; }
  return `<div class="card"><div class="billhead"><h2>Compliance calendar</h2>${monthPicker()}</div><p class="muted">All companies. Orange = something due, green = all filed.</p>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${cells}</div></div>
  <div class="card"><h3>Due in ${S.month}</h3>${rows.length?rows.map(r=>taskRow(r.t,r.cmp)).join(''):'<p class="muted">Nothing due.</p>'}</div>`;
}

function onCoInput(el){ const path=el.dataset.co.split('.'); let o=S.coDraft; for(let i=0;i<path.length-1;i++){ o[path[i]]=o[path[i]]||{}; o=o[path[i]]; } let v=el.value; if(['tallyPort','qrmpDay'].includes(path[0])&&v!=='') v=+v; if(path[path.length-1]==='rate') v=+v||0; if(path[0]==='gstin'||path[0]==='tan') v=String(v).toUpperCase().trim(); o[path[path.length-1]]=v; if(el.tagName==='SELECT'||path[0]==='gstin') render(); }
async function saveLedgers(names){
  const c=co(); names=[...new Set(names.map(s=>String(s).trim()).filter(Boolean))];
  const old=await Store.get('ledgers',c.id+'_0'); // chunk docs of 2500 names
  for(let i=0;i<Math.max(1,Math.ceil(names.length/2500));i++) await Store.set('ledgers',`${c.id}_${i}`,{cid:c.id,names:names.slice(i*2500,(i+1)*2500),at:new Date().toISOString()});
  for(let i=Math.ceil(names.length/2500);i<20;i++){ const ex=await Store.get('ledgers',`${c.id}_${i}`); if(!ex) break; await Store.del('ledgers',`${c.id}_${i}`); }
  toast(`${names.length} ledgers saved`); await logIt(`Ledger list loaded (${names.length})`);
}
function parseLedgerFile(name,buf,text){
  if(/\.xlsx?$/i.test(name)&&window.XLSX){ const wb=XLSX.read(buf,{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}); return pickNameCol(rows); }
  if(/<LEDGER/i.test(text)){ return [...text.matchAll(/<LEDGER[^>]*NAME="([^"]+)"/gi)].map(m=>m[1].replace(/&amp;/g,'&')); }
  const rows=text.split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"')));
  return pickNameCol(rows);
}
function pickNameCol(rows){ if(!rows.length) return []; const h=(rows[0]||[]).map(x=>String(x||'').toLowerCase()); let ci=h.findIndex(x=>/name|particulars|ledger/.test(x)); const start=ci>=0?1:0; if(ci<0) ci=0; return rows.slice(start).map(r=>r&&r[ci]).filter(x=>x&&String(x).trim()); }

document.addEventListener('click',async e=>{

  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act; const b=a.dataset.bill?S.bills.find(x=>x.id===a.dataset.bill):null;
  const putBill=async(bb,patch)=>{ const {id,...rest}=bb; await Store.set('bills',bb.id,{...rest,...patch}); };
  try{
  switch(act){
    case 'pick': $('#fileIn').click(); break;
    case 'manual': { const c=co(); const id=uid(); await Store.set('bills',id,{cid:c.id,status:'draft',createdAt:new Date().toISOString(),source:'typed by hand',supplierName:'',supplierGSTIN:'',invoiceNo:'',invoiceDate:'',lines:[{description:'',hsn:'',rate:18,taxable:0,cgst:0,sgst:0,igst:0,cess:0,ledger:c.defaultPurchase||''}],roundOff:0,total:0,voucherType:c.purchaseVchType||'Purchase',tds:{on:false}}); S.tab='review'; render(); break; }

    case 'delLine': b.lines.splice(+a.dataset.line,1); await putBill(b,{}); rerenderCard(b); break;

    case 'unapprove': await putBill(b,{status:'draft'}); break;

    case 'export': await doExport(); break;
    case 'posted': await putBill(b,{status:'posted',postedAt:new Date().toISOString()}); await logIt(`Posted in Tally: ${b.supplierName} #${b.invoiceNo}`); break;
    case 'tallyFail': openModal(`<h3>Tally error</h3><label class="f">What did Tally / the bridge say?<input id="tErr"></label><div class="row" style="margin-top:10px"><button class="primary" data-act="tallyFailSave" data-bill="${b.id}">Send back to review</button><button data-act="close">Cancel</button></div>`); break;

  if(ix('closingdr')>=0){ lines.forEach(l=>{ const c=splitCsv(l); rows.push({type:c[ix('type')]||'LEDGER',name:c[ix('name')],parent:c[ix('parent')],sub:c[ix('sub')],primary:c[ix('primary')],isRev:c[ix('isrevenue')],affGP:c[ix('affectsgp')],odr:+c[ix('openingdr')]||0,ocr:+c[ix('openingcr')]||0,cdr:+c[ix('closingdr')]||0,ccr:+c[ix('closingcr')]||0}); }); }
  else { const n=head.findIndex(h=>/name|particulars|ledger/.test(h)), p=head.findIndex(h=>/primary|group/.test(h)), s=head.findIndex(h=>/^sub/.test(h)), d=head.findIndex(h=>/debit|^dr/.test(h)), c=head.findIndex(h=>/credit|^cr/.test(h));
    if(n<0||d<0||c<0) throw new Error('Need columns: Name, Primary group, Debit, Credit');
    lines.forEach(l=>{ const x=splitCsv(l); if(!x[n]) return; rows.push({type:/closing stock/i.test(x[n])?'STOCK':'LEDGER',name:x[n],primary:p>=0?x[p]:'',sub:s>=0?x[s]:'',isRev:[PG.sales,PG.purch,PG.dinc,PG.dexp,PG.iinc,PG.iexp].includes(p>=0?x[p]:'')?'Yes':'No',affGP:[PG.sales,PG.purch,PG.dinc,PG.dexp].includes(p>=0?x[p]:'')?'Yes':'No',odr:0,ocr:0,cdr:Math.abs(num(x[d])),ccr:Math.abs(num(x[c]))}); }); }

function splitCsv(l){ const out=[]; let cur='',q=false; for(let i=0;i<l.length;i++){ const ch=l[i]; if(q){ if(ch==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; } else if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); }
function cashFlow(cur,prev){
  // Indirect method (AS 3 / Ind AS 7). cur, prev = buildFS results; prev null → from financial-year opening.
  const openOf=new Map(); if(prev) prev.rows.forEach(r=>openOf.set(r.name,r.net));
  const REVP=[PG.sales,PG.purch,PG.dinc,PG.dexp,PG.iinc,PG.iexp];
  const isRevRow=r=>r.isRev==='Yes'||REVP.includes(r.primary);
  const per=r=>prev?r2(r.net-(openOf.get(r.name)||0)):r.net;
  const rev=cur.rows.filter(isRevRow);
  const sumIf=f=>r2(rev.filter(f).reduce((s,r)=>s+per(r),0));
  const isExp=r=>[PG.iexp,PG.dexp].includes(r.primary)||(r.isRev==='Yes'&&r.net>0&&!REVP.includes(r.primary));
  const isInc=r=>[PG.iinc,PG.dinc].includes(r.primary);
  const dep=sumIf(r=>isExp(r)&&/depreciat|amorti[sz]/i.test(r.name));
  const taxExp=sumIf(r=>isExp(r)&&/income[- ]?tax|provision for (income )?tax|deferred tax|current tax/i.test(r.name));
  const fin=sumIf(r=>isExp(r)&&/interest|finance (charge|cost)|loan processing/i.test(r.name)&&!/received|income|earned/i.test(r.name));
  const intInc=r2(-sumIf(r=>isInc(r)&&/interest/i.test(r.name)));
  const divInc=r2(-sumIf(r=>isInc(r)&&/dividend/i.test(r.name)));
  const np=prev?r2(cur.pl.np-prev.pl.np):cur.pl.np;
  const pbt=r2(np+taxExp);
  const L={op:[],inv:[],fin:[]}; const add=(sec,label,v)=>{ v=r2(v); if(Math.abs(v)<0.005) return; const x=L[sec].find(l=>l[0]===label); if(x) x[1]=r2(x[1]+v); else L[sec].push([label,v]); };
  add('op','Net profit before tax',pbt); add('op','Add: depreciation & amortisation',dep); add('op','Add: finance costs',fin); add('op','Less: interest income',-intInc); add('op','Less: dividend income',-divInc);
  const opBefore=r2(pbt+dep+fin-intInc-divInc);
  let cashOpen=0,cashClose=0; const wc=[];
  cur.rows.forEach(r=>{ if(isRevRow(r)||isPL(r.name)||r.sub==='Stock-in-Hand') return;
    const open=prev?(openOf.get(r.name)||0):r.open, close=r.net, eff=r2(-(close-open));
    const isCash=(r.primary===PG.ca&&['Bank Accounts','Cash-in-Hand'].includes(r.sub))||(r.primary===PG.loan&&/bank od/i.test(r.sub||''));
    if(isCash){ cashOpen+=open; cashClose+=close; return; }
    if(/advance tax|tds receivable|tcs receivable|income[- ]?tax|self[- ]assessment|provision for (income )?tax|mat credit/i.test(r.name)) return wc.push(['tax',eff]);
    if(r.primary===PG.ca) return wc.push([{ 'Sundry Debtors':'(Increase)/decrease in trade receivables','Loans & Advances (Asset)':'(Increase)/decrease in loans & advances','Deposits (Asset)':'(Increase)/decrease in deposits'}[r.sub]||'(Increase)/decrease in other current assets',eff]);
    if(r.primary===PG.cl) return wc.push([{'Sundry Creditors':'Increase/(decrease) in trade payables','Duties & Taxes':'Increase/(decrease) in GST/TDS & other duties payable','Provisions':'Increase/(decrease) in provisions'}[r.sub]||'Increase/(decrease) in other current liabilities',eff]);
    if(r.primary===PG.fa) return add('inv','Purchase of fixed assets (net of sales)',eff);
    if(r.primary===PG.inv) return add('inv','(Purchase)/sale of investments',eff);
    if(r.primary===PG.cap) return add('fin',r.sub==='Reserves & Surplus'?'Other changes in reserves':'Share capital raised / (returned)',eff);
    if(r.primary===PG.loan) return add('fin','Borrowings taken / (repaid)',eff);
    wc.push(['Other items',eff]);
  });
  const stockOpen=prev?prev.pl.closeStock:cur.pl.openStock;
  wc.push(['(Increase)/decrease in inventories',r2(stockOpen-cur.pl.closeStock)]);
  wc.filter(w=>w[0]!=='tax').forEach(w=>add('op',w[0],w[1]));
  const tax=r2(wc.filter(w=>w[0]==='tax').reduce((s,w)=>s+w[1],0)-taxExp);
  add('op','Less: income tax paid (net)',tax);
  add('inv','Purchase of fixed assets (net of sales)',-dep); // depreciation reduced the asset ledgers
  add('inv','Interest received',intInc); add('inv','Dividend received',divInc);
  add('fin','Interest & finance costs paid',-fin);
  const tot=k=>r2(L[k].reduce((s,l)=>s+l[1],0));
  const op=tot('op'), inv=tot('inv'), fn=tot('fin'), net=r2(op+inv+fn);
  cashOpen=r2(cashOpen); cashClose=r2(cashClose);
  return {L,op,inv,fin:fn,net,opBefore,cashOpen,cashClose,actual:r2(cashClose-cashOpen),diff:r2(net-(cashClose-cashOpen))};
}

async function readStatementFile(f){

      for(let p=1;p<=n;p++){ prog(`Preparing page ${p}/${n}…`); const pg=await pdf.getPage(p); const vp=pg.getViewport({scale:2}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; pages.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85))); } }
    else pages=await fileToImages(f);
    for(let i=0;i<pages.length;i+=2){ prog(`AI reading pages ${i+1}-${Math.min(i+2,pages.length)} of ${pages.length}…`);
      const res=await Store.ai(`Extract every transaction row from these bank/card/loan statement page(s) for "${c.name}". Reply with ONLY JSON:
{"accountLast4":"","txns":[{"date":"YYYY-MM-DD","narration":"","ref":"","withdrawal":0,"deposit":0,"balance":0}]}

   ${Math.abs(m.diff)>1?`<div class="chk bad">✖ Cash flow differs from the actual change in cash & bank by ₹${fmt(m.diff)} – usually an opening-balance difference in Tally or ledgers under unusual groups</div>`:'<div class="chk ok">✔ Net cash flow = actual change in cash &amp; bank balances</div>'}</div>
   <div class="card"><h3>Cash flow statement (indirect method, ₹)</h3>${q?'':'<p class="muted">Only one period loaded – showing year to date. Load the previous quarter end to get the quarter alone.</p>'}
   <div class="tw"><table><tr><th></th>${q?'<th class="n">This quarter</th>':''}<th class="n">Year to date</th></tr>
   ${sec('op','A. Operating activities',q&&q.op,ytd.op)}${sec('inv','B. Investing activities',q&&q.inv,ytd.inv)}${sec('fin','C. Financing activities',q&&q.fin,ytd.fin)}
   <tr style="background:var(--accent2)"><th>Net increase/(decrease) in cash (A+B+C)</th>${q?`<th class="n">${fmt(q.net)}</th>`:''}<th class="n">${fmt(ytd.net)}</th></tr>
   <tr><td>Opening cash &amp; bank</td>${q?`<td class="n">${fmt(q.cashOpen)}</td>`:''}<td class="n">${fmt(ytd.cashOpen)}</td></tr><tr><td><b>Closing cash &amp; bank</b></td>${q?`<td class="n"><b>${fmt(q.cashClose)}</b></td>`:''}<td class="n"><b>${fmt(ytd.cashClose)}</b></td></tr></table></div>
   <ul class="tight muted"><li>Depreciation, finance cost, interest and tax are picked up by ledger name (e.g. “Depreciation”, “Interest on Loan”, “Advance Tax”) – keep those words in the ledger names.</li><li>Bank overdraft is treated as part of cash. Draft for management use – your auditor finalises the statutory cash flow.</li></ul></div>`;
}
function fsReportHTML(c,tb){
  const fs=snapFS(tb,S.inclAdj), q=qPL(tb), ytd=fs.pl;
  const row=(l,a,b)=>`<tr><td>${l}</td><td class="n">${a==null?'':fmt(a)}</td><td class="n">${b==null?'':fmt(b)}</td></tr>`;
  const css=`body{font-family:Arial,sans-serif;background:#FFF6EC;color:#141414;font-weight:600;margin:24px}h1,h2{margin:6px 0}table{border-collapse:collapse;width:100%;margin:8px 0 18px}td,th{border-bottom:1px solid #F2B880;padding:5px 7px;text-align:left}th{background:#FFE2C2}.n{text-align:right}.note{font-size:12px;color:#3A2A1A}`;
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(c.name)} – accounts to ${esc(tb.to)}</title><style>${css}</style></head><body>
  <h1>${esc(c.name)}</h1><div class="note">Provisional management accounts · period ${esc(fyStart(tb.to))} to ${esc(tb.to)} · prepared ${isoDate(new Date())} from Tally${S.inclAdj?' incl. provisions not yet posted':''} · unaudited</div>
  <h2>Profit &amp; Loss (₹)</h2><table><tr><th></th><th class="n">${prevSnap(tb)?'Quarter':'YTD'}</th><th class="n">Year to date</th></tr>
  ${row('Revenue from sales',q.sales,ytd.sales)}${row('Direct income',q.dinc,ytd.dinc)}${row('Opening stock',q.openStock,ytd.openStock)}${row('Purchases',q.purch,ytd.purch)}${row('Direct expenses',q.dexp,ytd.dexp)}${row('Closing stock',q.closeStock,ytd.closeStock)}${row('<b>Gross profit</b>',q.gp,ytd.gp)}${row('Other income',q.iinc,ytd.iinc)}${row('Indirect expenses',q.iexp,ytd.iexp)}${row('<b>Net profit (as per Tally)</b>',q.np,ytd.np)}</table>
  <h2>Balance sheet as on ${esc(tb.to)} (₹)</h2><table><tr><th>Equity &amp; liabilities</th><th class="n"></th><th></th></tr>${Object.entries(fs.L).filter(([k,v])=>Math.abs(v)>0.004).map(([k,v])=>row(k.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase()),v,null)).join('')}${row('<b>Total</b>',fs.totL,null)}
  <tr><th>Assets</th><th></th><th></th></tr>${Object.entries(fs.A).filter(([k,v])=>Math.abs(v)>0.004).map(([k,v])=>row(k.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase()),v,null)).join('')}${row('<b>Total</b>',fs.totA,null)}</table>
  ${(()=>{ const {ytd:cf,q:cq}=cfFor(tb); const rr=(k)=>{ const labs=[...new Set([...(cq?cq.L[k]:[]),...cf.L[k]].map(l=>l[0]))]; return labs.map(l=>row(esc(l),cq?(cq.L[k].find(x=>x[0]===l)||[0,0])[1]:null,(cf.L[k].find(x=>x[0]===l)||[0,0])[1])).join(''); };
   return `<h2>Cash flow statement – indirect method (₹)</h2><table><tr><th></th><th class="n">${cq?'Quarter':''}</th><th class="n">Year to date</th></tr><tr><th colspan="3">A. Operating activities</th></tr>${rr('op')}${row('<b>Net cash from operating activities</b>',cq&&cq.op,cf.op)}<tr><th colspan="3">B. Investing activities</th></tr>${rr('inv')}${row('<b>Net cash from investing activities</b>',cq&&cq.inv,cf.inv)}<tr><th colspan="3">C. Financing activities</th></tr>${rr('fin')}${row('<b>Net cash from financing activities</b>',cq&&cq.fin,cf.fin)}${row('<b>Net increase/(decrease) in cash</b>',cq&&cq.net,cf.net)}${row('Opening cash &amp; bank',cq&&cq.cashOpen,cf.cashOpen)}${row('<b>Closing cash &amp; bank</b>',cq&&cq.cashClose,cf.cashClose)}</table>`; })()}
  <h2>Trial balance as on ${esc(tb.to)} (₹)</h2><table><tr><th>Ledger</th><th>Group</th><th class="n">Debit</th><th class="n">Credit</th></tr>${fs.rows.filter(r=>Math.abs(r.net)>0.004).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.primary)}</td><td class="n">${r.net>0?fmt(r.net):''}</td><td class="n">${r.net<0?fmt(-r.net):''}</td></tr>`).join('')}<tr><th colspan="2">Total</th><th class="n">${fmt(fs.tbDr)}</th><th class="n">${fmt(fs.tbCr)}</th></tr></table>
  <div class="note">Draft for management review. Statutory financial statements, tax provisions and Schedule III classification to be finalised by the auditor.</div></body></html>`;
}
function reqFile(kind,payload){ const c=co(); const stamp=new Date().toISOString().replace(/[-:T]/g,'').slice(0,14); const code=(c.code||c.short||'CO').replace(/[^A-Za-z0-9]/g,''); return saveFile(`tallyreq_${code}_${stamp}.txt`,JSON.stringify({type:kind,company:c.tallyName||c.name,code,...payload}),'Tally request'); }

// ---------- events ----------
const hiddenIn=(id,accept,fn)=>{ const i=document.createElement('input'); i.type='file'; i.id=id; i.accept=accept; i.hidden=true; i.onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(f) await fn(f); }; document.body.appendChild(i); return i; };
hiddenIn('stmtIn','.csv,.txt,.xlsx,.xls,.pdf,image/*',importStatement);
hiddenIn('bookIn','.csv,.txt,.xlsx,.xls',async f=>{ try{ let rows; if(/\.(xlsx|xls)$/i.test(f.name)){ const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}); } else rows=(await f.text()).replace(/^﻿/,'').split(/\r?\n/).filter(l=>!/^#KAD/.test(l)).map(splitCsv);
  const map=detectCols(rows); if(!map) throw new Error('Need Date, Particulars, Debit, Credit columns'); S.books=rowsToTxns(rows,map).map(b=>({date:b.date,narr:b.narr,dr:b.dr,cr:b.cr})); toast(`${S.books.length} Tally entries loaded`); render(); }catch(e){ toast(e.message||'Could not read file'); } });
hiddenIn('tbIn','.csv,.txt',async f=>{ try{ const c=co(); const {meta,rows}=parseTBcsv(await f.text()); if(!rows.length) throw new Error('No ledgers in file'); const to=meta.to||$('#tbTo')?.value||lastQEnd(); if(meta.company&&norm(meta.company)!==norm(c.tallyName||c.name)) toast(`Note: file is for “${meta.company}”`,4000);
  const id=`${c.id}_${to.replace(/-/g,'')}`; const doc={cid:c.id,to,from:meta.from||fyStart(to),rows,source:meta.company?'Tally bridge':'uploaded file',at:new Date().toISOString()};
  if(JSON.stringify(doc).length>240000){ toast('Trial balance too large to store – contact support'); return; }
  await Store.set('tbs',id,doc); S.tbSel=id; await logIt(`Trial balance loaded to ${to} (${rows.length} rows)`); toast('Trial balance loaded'); }catch(e){ toast(e.message||'Could not read file',4000); } });
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act; const c=co(); if(!c) return;
  const saveCo=async patch=>{ const {id,...rest}={...c,...patch}; await Store.set('companies',c.id,rest); };
  try{ switch(act){
    case 'bankAddShow': $('#bankAddBox').style.display='flex'; break;
    case 'bankAdd': { const l=$('#bkLed').value.trim(); if(!l){toast('Enter the ledger name');break;} const banks=[...(c.banks||[]).filter(b=>b.ledger!==l),{ledger:l,last4:$('#bkL4').value.trim()}]; await saveCo({banks}); S.bankSel=l; toast('Account saved'); break; }
    case 'bankPick': S.bankSel=a.dataset.l; S.books=null; S.stmtMsg=''; render(); break;
    case 'stmtPick': $('#stmtIn').click(); break;
    case 'txFilter': S.txFilter=a.dataset.f; render(); break;
    case 'txOk': await updateTx([a.dataset.id],{status:'ready'}); break;
    case 'txIgnore': await updateTx([a.dataset.id],{status:'ignored'}); break;
    case 'txUndo': await updateTx([a.dataset.id],{status:'new'}); break;
    case 'txPosted': await updateTx([a.dataset.id],{status:'posted'}); break;
    case 'txOkAll': { const ids=monthTx().filter(t=>(t.status||'new')==='new'&&t.ledger).map(t=>t.id); await updateTx(ids,{status:'ready'}); toast(`${ids.length} marked ready`); break; }
    case 'txExport': { const ready=allTx(S.bankSel).filter(t=>t.status==='ready'); const bad=ready.filter(t=>!t.ledger); if(bad.length){toast('Some entries have no ledger');break;}
      const stamp=new Date().toISOString().replace(/[-:T]/g,'').slice(0,14); const fn=`tally_${(c.code||c.short||'CO').replace(/[^A-Za-z0-9]/g,'')}_${stamp}_bank.txt`;
      const r=await saveFile(fn,bankXML(ready,c,S.bankSel),'Tally bank file'); if(r==='declined') break;
      await updateTx(ready.map(t=>t.id),{status:'sent',sentFile:fn});
      for(const t of ready.filter(t=>t.billId)){ const b=S.bills.find(x=>x.id===t.billId); if(b){ const {id,...rest}=b; await Store.set('bills',b.id,{...rest,paidTxn:t.id,paidOn:t.date}); } }
      await logIt(`Bank file ${fn}: ${ready.length} voucher(s)`); break; }
    case 'txRule': { const t=allTx(S.bankSel).find(x=>x.id===a.dataset.id); openModal(`<h3>Remember a rule</h3><p class="muted">Every future entry whose narration contains this text gets this ledger.</p><p class="muted">${esc(t.narr)}</p>
      <div class="grid2"><label class="f">Narration contains<input id="ruleK" value="${esc(guessKeyword(t.narr))}"></label><label class="f">Ledger in Tally<input id="ruleL" list="ledList3" value="${esc(t.ledger||'')}"></label></div>
      <label class="row" style="gap:6px;margin-top:8px"><input type="checkbox" id="ruleD" checked> Only for money ${t.dr?'going out':'coming in'}</label>
      <div class="row" style="margin-top:10px"><button class="primary" data-act="ruleSave" data-dir="${t.dr?'dr':'cr'}">Save rule &amp; apply</button><button data-act="close">Cancel</button></div>`); break; }
    case 'ruleSave': { const k=$('#ruleK').value.trim(), l=$('#ruleL').value.trim(); if(!k||!l){toast('Fill both');break;} const rule={k,ledger:l,dir:$('#ruleD').checked?a.dataset.dir:''}; const rules=[rule,...(c.bankRules||[]).filter(r=>r.k!==k)]; await saveCo({bankRules:rules}); closeModal();
      const ids=allTx(S.bankSel).filter(t=>(t.status||'new')==='new'&&String(t.narr).toUpperCase().includes(k.toUpperCase())&&(!rule.dir||rule.dir===(t.dr?'dr':'cr'))).map(t=>t.id);
      await updateTx(ids,t=>({ledger:l,kind:'rule',reason:`Your rule: “${k}”`})); toast(`Rule saved – applied to ${ids.length} entr${ids.length===1?'y':'ies'}`); break; }
    case 'reqBook': { const [y,m]=S.month.split('-').map(Number); await reqFile('bankbook',{ledger:S.bankSel,from:`${S.month}-01`,to:isoDate(new Date(y,m,0))}); break; }
    case 'loadBook': $('#bookIn').click(); break;
    case 'markInBooks': { const r=matchBank(monthTx().filter(t=>t.status!=='ignored'),S.books.filter(b=>b.date.startsWith(S.month))); const ids=r.matched.filter(m=>!['inbooks','posted'].includes(m.t.status)).map(m=>m.t.id); await updateTx(ids,{status:'inbooks'}); toast(`${ids.length} marked as already in Tally`); break; }
    case 'linkPay': { const t=allTx(S.bankSel).find(x=>x.id===a.dataset.id); const d=new Date(t.date); const pm=d.getDate()<=10?new Date(d.getFullYear(),d.getMonth()-1,1):new Date(d.getFullYear(),d.getMonth(),1);
      const per=`${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,'0')}`; const opts=t.kind==='tds'?[`TDSPAY_${per}`]:[`GSTR3B_${per}`,`PMT06_${per}`,`GSTR3BQ_${per}`];
      openModal(`<h3>Record payment in filing calendar</h3><p>${esc(t.date)} · ₹${fmt(t.dr)} · ${esc(t.narr)}</p><label class="f">Which filing?<select id="lpKey">${opts.map(k=>`<option>${k}</option>`).join('')}</select></label><label class="f" style="margin-top:8px">Challan / CIN / CPIN (from narration or challan)<input id="lpAck" value="${esc(t.ref||'')}"></label>
      <div class="row" style="margin-top:10px"><button class="primary" data-act="lpSave" data-date="${t.date}" data-amt="${t.dr}" data-kind="${t.kind}">Save</button><button data-act="close">Cancel</button></div>`); break; }
    case 'lpSave': { const key=$('#lpKey').value; await setTask(c.id,key,{status:a.dataset.kind==='tds'?'filed':'started',filedOn:a.dataset.date,ack:$('#lpAck').value,amount:a.dataset.amt,note:'From bank statement'}); await logIt(`Bank payment linked to ${key}`); closeModal(); toast('Recorded'); break; }
    case 'acctSub': S.acctSub=a.dataset.s; render(); break;
    case 'reqTB': { const to=$('#tbTo').value; if(!to){toast('Pick the period end');break;} await reqFile('tb',{from:fyStart(to),to}); break; }
    case 'loadTB': $('#tbIn').click(); break;
    case 'tbDel': await Store.del('tbs',S.tbSel); S.tbSel=''; break;
    case 'tbTemplate': await saveFile('trial_balance_template.csv',csv([['Name','Primary group','Sub group','Debit','Credit'],['Share Capital','Capital Account','','','1000000'],['HDFC Bank','Current Assets','Bank Accounts','250000',''],['Sales','Sales Accounts','','','800000'],['Closing Stock','Current Assets','Stock-in-Hand','150000','']])); break;
    case 'fsReport': { const tb=S.tbs.find(x=>x.id===S.tbSel); await saveFile(`accounts_${c.code||'co'}_${tb.to}.html`,fsReportHTML(c,tb)); break; }
    case 'fsCsv': { const tb=S.tbs.find(x=>x.id===S.tbSel); const fs=snapFS(tb,S.inclAdj); const rows=[['Section','Item','Amount']]; Object.entries(fs.pl).forEach(([k,v])=>rows.push(['P&L YTD',k,v])); Object.entries(fs.L).forEach(([k,v])=>rows.push(['Liabilities',k,v])); Object.entries(fs.A).forEach(([k,v])=>rows.push(['Assets',k,v])); { const cf=cfFor(tb).ytd; ['op','inv','fin'].forEach(k=>cf.L[k].forEach(l=>rows.push(['Cash flow YTD',l[0],l[1]]))); rows.push(['Cash flow YTD','Net change in cash',cf.net]); } fs.rows.forEach(r=>rows.push(['TB',r.name+' ['+r.primary+']',r.net])); await saveFile(`accounts_${c.code||'co'}_${tb.to}.csv`,csv(rows)); break; }
    case 'adjPick': { $('#adjKind').value=a.dataset.k; $('#adjKind').dispatchEvent(new Event('change',{bubbles:true})); $('#adjAmt').focus(); break; }
    case 'adjAdd': { const amt=+String($('#adjAmt').value).replace(/,/g,''); const dr=$('#adjDr').value.trim(), cr=$('#adjCr').value.trim(); if(!(amt>0)||!dr||!cr||dr.startsWith('(')||cr.startsWith('(')){ toast('Enter amount and both ledgers'); break; }
      const id=uid(); await Store.set('adj',id,{cid:c.id,kind:$('#adjKind').value,date:$('#adjDate').value,drLedger:dr,crLedger:cr,amount:amt,narration:$('#adjNar').value,status:'pending',at:new Date().toISOString()}); await logIt(`Provision added: ${dr} / ${cr} ₹${fmt(amt)}`); toast('Provision added'); break; }
    case 'adjDel': await Store.del('adj',a.dataset.id); break;
    case 'adjPosted': { const j=S.adjs.find(x=>x.id===a.dataset.id); const {id,...rest}=j; await Store.set('adj',j.id,{...rest,status:'posted'}); break; }
    case 'adjExport': { const p=S.adjs.filter(j=>j.status==='pending'); const stamp=new Date().toISOString().replace(/[-:T]/g,'').slice(0,14); const fn=`tally_${(c.code||c.short||'CO').replace(/[^A-Za-z0-9]/g,'')}_${stamp}_journal.txt`;
      const r=await saveFile(fn,journalXML(p,c),'Tally journal file'); if(r==='declined') break; for(const j of p){ const {id,...rest}=j; await Store.set('adj',j.id,{...rest,status:'sent',sentFile:fn}); } await logIt(`Journal file ${fn}: ${p.length} provision(s)`); break; }
  }}catch(err){ console.error(err); toast('Something went wrong: '+(err.message||err)); }
});
const txTimers={};
document.addEventListener('input',e=>{ const el=e.target;
  if(el.dataset.tx){ const id=el.dataset.tx, v=el.value; clearTimeout(txTimers[id]); S.editing='tx'; txTimers[id]=setTimeout(async()=>{ S.editing=null; await updateTx([id],{ledger:v,reason:'Chosen by you',kind:allTx(S.bankSel).find(t=>t.id===id)?.kind==='unknown'?'manual':allTx(S.bankSel).find(t=>t.id===id)?.kind}); },900); }
  if(el.id==='csOv'){ S.closeStockOv=el.value; clearTimeout(txTimers.cs); txTimers.cs=setTimeout(()=>render(),700); } });
document.addEventListener('change',e=>{ const el=e.target;
  if(el.id==='tbSel'){ S.tbSel=el.value; S.closeStockOv=''; render(); }
  if(el.id==='inclAdj'){ S.inclAdj=el.checked; render(); }
  if(el.id==='adjKind'){ const t=ADJ_T.find(x=>x.k===el.value); const d=$('#adjDr'), c=$('#adjCr'); if(d&&!d.value) d.placeholder=t.dr; if(c&&!c.value) c.placeholder=t.cr; if(d&&t.dr&&!t.dr.startsWith('(')&&!d.value) d.value=findLedger(t.dr)||t.dr; if(c&&t.cr&&!t.cr.startsWith('(')&&!c.value) c.value=findLedger(t.cr)||t.cr; $('#adjTip').style.display=t.tds?'block':'none'; } });

(async()=>{
  const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)) S.tab=h;
  render(); await Store.init(); subscribeAll(); render();
})();
</script>
