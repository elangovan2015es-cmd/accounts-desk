}

<script>
/*CORE-START*/
// ---------- pure helpers (tested offline) ----------
const STATES={"01":"Jammu and Kashmir","02":"Himachal Pradesh","03":"Punjab","04":"Chandigarh","05":"Uttarakhand","06":"Haryana","07":"Delhi","08":"Rajasthan","09":"Uttar Pradesh","10":"Bihar","11":"Sikkim","12":"Arunachal Pradesh","13":"Nagaland","14":"Manipur","15":"Mizoram","16":"Tripura","17":"Meghalaya","18":"Assam","19":"West Bengal","20":"Jharkhand","21":"Odisha","22":"Chhattisgarh","23":"Madhya Pradesh","24":"Gujarat","26":"Dadra and Nagar Haveli and Daman and Diu","27":"Maharashtra","29":"Karnataka","30":"Goa","31":"Lakshadweep","32":"Kerala","33":"Tamil Nadu","34":"Puducherry","35":"Andaman and Nicobar Islands","36":"Telangana","37":"Andhra Pradesh","38":"Ladakh","97":"Other Territory"};
const QRMP_GROUP1=["22","23","24","25","26","27","29","30","31","32","33","34","35","36","37"];
const GST_RATES=[0,3,5,12,18,28,40];
const r2=x=>Math.round((+x||0)*100)/100;
const fmt=x=>(+x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const xesc=esc;
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const invNorm=s=>String(s||'').toUpperCase().replace(/\d+/g,n=>n.replace(/^0+(?=\d)/,'')).replace(/[^A-Z0-9]/g,'');

function gstinValid(g){
  g=String(g||'').toUpperCase().trim();
  if(!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return false;
  const cs='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let sum=0;
  for(let i=0;i<14;i++){ const v=cs.indexOf(g[i])*(i%2?2:1); sum+=Math.floor(v/36)+(v%36); }
  return cs[(36-(sum%36))%36]===g[14];
}
function stateOf(gstin){ const c=String(gstin||'').slice(0,2); return STATES[c]?c:''; }

// GST + TDS due-date calendar. y,m = the month in which tasks fall due (m 1-12).
function dueTasks(co,y,m){
  const out=[]; const d=(dd,mm=m,yy=y)=>{const x=new Date(yy,mm-1,1); const last=new Date(yy,mm,0).getDate(); return new Date(yy,mm-1,Math.min(dd,last));};
  const pm=m===1?12:m-1, py=m===1?y-1:y; const per=`${py}-${String(pm).padStart(2,'0')}`;
  const mn=n=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][n-1];
  const perLabel=`${mn(pm)} ${py}`;
  const qEnd=[3,6,9,12].includes(pm); const qLabel=()=>{const s=pm-2; return `${mn(s)}–${mn(pm)} ${py}`;};
  if(co.gstin){
    if((co.gstFreq||'monthly')==='monthly'){
      out.push({key:`GSTR1_${per}`,kind:'gst',title:'GSTR-1 (outward supplies)',period:perLabel,due:d(11),portal:'gst'});
      out.push({key:`GSTR3B_${per}`,kind:'gst',title:'GSTR-3B (summary + tax payment)',period:perLabel,due:d(20),portal:'gst'});
    } else {
      if(qEnd){
        const grp=co.qrmpDay||(QRMP_GROUP1.includes(stateOf(co.gstin))?22:24);
        out.push({key:`GSTR1Q_${per}`,kind:'gst',title:'GSTR-1 quarterly (QRMP)',period:qLabel(),due:d(13),portal:'gst'});
        out.push({key:`GSTR3BQ_${per}`,kind:'gst',title:'GSTR-3B quarterly (QRMP)',period:qLabel(),due:d(grp),portal:'gst'});
      } else {
        out.push({key:`IFF_${per}`,kind:'gst',title:'IFF – B2B invoices (optional, QRMP)',period:perLabel,due:d(13),portal:'gst',optional:true});
        out.push({key:`PMT06_${per}`,kind:'gst',title:'PMT-06 – monthly GST payment (QRMP)',period:perLabel,due:d(25),portal:'gst'});
      }
    }
  }
  if(co.tan){
    // TDS deposit: 7th of next month; March deductions by 30 April
    out.push({key:`TDSPAY_${per}`,kind:'tds',title:'TDS deposit (challan)',period:perLabel,due:pm===3?d(30):d(7),portal:'it'});
    const retMap={7:[6,'Q1 (Apr–Jun)'],10:[9,'Q2 (Jul–Sep)'],1:[12,'Q3 (Oct–Dec)'],5:[3,'Q4 (Jan–Mar)']};
    if(retMap[m]){
      const [qm,ql]=retMap[m]; const qy=m===1?y-1:y; const fy=qm<=3?qy-1:qy;
      const lastMonthOfQ = new Date(qy,qm-1,1); const isNew = lastMonthOfQ>=new Date(2026,3,1);
      const forms=isNew?'Form 140 (non-salary) / Form 138 (salary)':'Form 26Q (non-salary) / Form 24Q (salary)';
      out.push({key:`TDSRET_${qy}-${String(qm).padStart(2,'0')}`,kind:'tds',title:`TDS return ${ql} – ${forms}`,period:`${ql} FY ${fy}-${String((fy+1)%100).padStart(2,'0')}`,due:d(31),portal:'it'});
    }
    const certMap={8:[6,'Q1'],11:[9,'Q2'],2:[12,'Q3'],6:[3,'Q4']};
    if(certMap[m]){
      const [qm,ql]=certMap[m]; const qy=m===2?y-1:y;
      out.push({key:`TDSCERT_${qy}-${String(qm).padStart(2,'0')}`,kind:'tds',title:`TDS certificates to parties – ${ql}`,period:`${ql}`,due:d(15),portal:'traces'});
    }
  }
  return out.map(t=>({...t,dueISO:isoDate(t.due)}));
}
function isoDate(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}

// Totals and checks for one bill against a company.
function billCalc(b){
  const lines=b.lines||[];
  const taxable=r2(lines.reduce((s,l)=>s+(+l.taxable||0),0));
  const cgst=r2(lines.reduce((s,l)=>s+(+l.cgst||0),0));
  const sgst=r2(lines.reduce((s,l)=>s+(+l.sgst||0),0));
  const igst=r2(lines.reduce((s,l)=>s+(+l.igst||0),0));
  const cess=r2(lines.reduce((s,l)=>s+(+l.cess||0),0));
  const ro=r2(b.roundOff||0);
  const computed=r2(taxable+cgst+sgst+igst+cess+ro);
  const tds=b.tds&&b.tds.on?r2(Math.round((+b.tds.base||taxable)*(+b.tds.rate||0)/100)):0;
  return {taxable,cgst,sgst,igst,cess,ro,computed,total:r2(b.total||computed),tds,party:r2((b.total||computed)-tds)};
}
function billChecks(b,co,ledgerSet,otherBills){
  const c=billCalc(b), out=[]; const add=(lvl,msg)=>out.push({lvl,msg});
  if(!b.supplierName) add('bad','Supplier name missing');
  if(!b.invoiceNo) add('bad','Invoice number missing');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(b.invoiceDate||'')) add('bad','Invoice date missing or unclear');
  else { const dt=new Date(b.invoiceDate); if(dt>new Date()) add('bad','Invoice date is in the future'); }
  if(b.supplierGSTIN){
    if(!gstinValid(b.supplierGSTIN)) add('bad',`Supplier GSTIN ${b.supplierGSTIN} fails the GSTIN check-digit test – re-read it`);
    else add('ok','Supplier GSTIN format and check digit OK');
    const sc=stateOf(b.supplierGSTIN), cc=stateOf(co.gstin);
    if(sc&&cc){
      if(sc===cc && c.igst>0) add('bad','Same-state supplier but IGST charged – should be CGST + SGST');
      if(sc!==cc && (c.cgst>0||c.sgst>0)) add('bad','Other-state supplier but CGST/SGST charged – should be IGST');
    }
  } else if(c.cgst+c.sgst+c.igst>0) add('bad','GST charged but supplier GSTIN missing – no input credit without it');
  else add('info','Unregistered supplier / no GST on bill');
  (b.lines||[]).forEach((l,i)=>{
    const rt=+l.rate||0, tx=+l.taxable||0, tax=(+l.cgst||0)+(+l.sgst||0)+(+l.igst||0);
    if(Math.abs(tax-tx*rt/100)>Math.max(1,lines_tol(tx))) add('warn',`Line ${i+1}: tax ${fmt(tax)} ≠ ${rt}% of ${fmt(tx)} (${fmt(tx*rt/100)})`);
    if(Math.abs((+l.cgst||0)-(+l.sgst||0))>0.5) add('bad',`Line ${i+1}: CGST and SGST are not equal`);
    if(!GST_RATES.includes(rt)) add('warn',`Line ${i+1}: unusual GST rate ${rt}%`);
  });
  if(Math.abs(c.computed-c.total)>1) add('bad',`Bill total ${fmt(c.total)} ≠ taxable + tax + round-off ${fmt(c.computed)}`);
  else add('ok','Totals add up');
  if(Math.abs(c.ro)>1) add('warn',`Round-off ${fmt(c.ro)} is more than ₹1`);
  const dup=(otherBills||[]).find(o=>o.id!==b.id && invNorm(o.invoiceNo)===invNorm(b.invoiceNo) && (norm(o.supplierGSTIN)===norm(b.supplierGSTIN)) && norm(o.supplierName).slice(0,6)===norm(b.supplierName).slice(0,6));
  if(dup) add('bad',`Possible duplicate: same supplier & invoice no. already entered (${dup.status})`);
  if(ledgerSet && ledgerSet.size){
    const pl=b.partyLedger||b.supplierName;
    if(!ledgerSet.has(norm(pl))) add('warn',`Party ledger “${pl}” not in Tally list – it will be created under Sundry Creditors`);
    (b.lines||[]).forEach((l,i)=>{ if(l.ledger && !ledgerSet.has(norm(l.ledger))) add('bad',`Line ${i+1}: ledger “${l.ledger}” not found in Tally`); });
    taxLedgers(b,co).forEach(n=>{ if(!ledgerSet.has(norm(n))) add('bad',`Tax ledger “${n}” not found in Tally`); });
    if(b.tds&&b.tds.on&&b.tds.ledger&&!ledgerSet.has(norm(b.tds.ledger))) add('bad',`TDS ledger “${b.tds.ledger}” not found in Tally`);
  } else add('warn','Tally ledger list not loaded for this company – ledger names not checked');
  (b.lines||[]).forEach((l,i)=>{ if(!l.ledger) add('bad',`Line ${i+1}: choose the purchase/expense ledger`); });
  if(b.tds&&b.tds.on){ if(!b.tds.ledger) add('bad','TDS ticked but TDS ledger not chosen'); if(!(+b.tds.rate>0)) add('bad','TDS ticked but rate missing'); }
  if(/^\d{4}-\d{2}-\d{2}$/.test(b.invoiceDate||'')){
    const dt=new Date(b.invoiceDate); const fyEnd=dt.getMonth()>=3?dt.getFullYear()+1:dt.getFullYear();
    const itcLast=new Date(fyEnd,10,30); if(new Date()>itcLast && (c.cgst+c.igst)>0) add('warn','ITC time limit (30 Nov after the financial year) may have passed for this bill');
  }
  return out;
}
function lines_tol(tx){return tx*0.002;}
function rateMap(co,rate){ return (co.rateLedgers||{})[rate]||{}; }
function taxLedgers(b,co){
  const s=new Set(); (b.lines||[]).forEach(l=>{ const m=rateMap(co,+l.rate||0);
    if(+l.cgst) s.add(m.cgst||co.cgstLedger||'Input CGST'); if(+l.sgst) s.add(m.sgst||co.sgstLedger||'Input SGST'); if(+l.igst) s.add(m.igst||co.igstLedger||'Input IGST'); if(+l.cess) s.add(co.cessLedger||'Input Cess'); });
  if(+b.roundOff) s.add(co.roundOffLedger||'Round Off');
  return [...s];
}
// Ledger entries: debit = negative amount + ISDEEMEDPOSITIVE Yes; credit = positive + No.
function voucherEntries(b,co){
  const c=billCalc(b), E=[]; const agg={};
  const put=(name,amt)=>{ if(!name||!r2(amt)) return; agg[name]=r2((agg[name]||0)+amt); };
  (b.lines||[]).forEach(l=>{ const m=rateMap(co,+l.rate||0);
    put(l.ledger,+l.taxable);
    put(m.cgst||co.cgstLedger||'Input CGST',+l.cgst); put(m.sgst||co.sgstLedger||'Input SGST',+l.sgst); put(m.igst||co.igstLedger||'Input IGST',+l.igst); put(co.cessLedger||'Input Cess',+l.cess); });
  if(c.ro) put(co.roundOffLedger||'Round Off',c.ro);
  const party=b.partyLedger||b.supplierName;
  E.push({ledger:party,dr:0,cr:c.party,party:true});
  if(c.tds) E.push({ledger:b.tds.ledger,dr:0,cr:c.tds});
  Object.entries(agg).forEach(([n,a])=>{ if(a>0) E.push({ledger:n,dr:a,cr:0}); else E.push({ledger:n,dr:0,cr:-a}); });
  const dr=r2(E.reduce((s,e)=>s+e.dr,0)), cr=r2(E.reduce((s,e)=>s+e.cr,0));
  return {entries:E,dr,cr,balanced:Math.abs(dr-cr)<0.01};
}
function tallyXML(bills,co,ledgerSet,opts={}){
  const ymd=s=>String(s||'').replace(/-/g,'');
  const amt=n=>r2(n).toFixed(2);
  let msgs='';
  if(opts.createParties!==false){
    const seen=new Set();
    bills.forEach(b=>{ const p=b.partyLedger||b.supplierName; const k=norm(p);
      if(seen.has(k)|| (ledgerSet&&ledgerSet.has(k))) return; seen.add(k);
      const st=STATES[stateOf(b.supplierGSTIN)]||STATES[stateOf(co.gstin)]||'';
      msgs+=`<TALLYMESSAGE xmlns:UDF="TallyUDF"><LEDGER NAME="${xesc(p)}" ACTION="Create"><NAME.LIST><NAME>${xesc(p)}</NAME></NAME.LIST><PARENT>${xesc(co.creditorGroup||'Sundry Creditors')}</PARENT><ISBILLWISEON>Yes</ISBILLWISEON>${b.supplierGSTIN?`<GSTREGISTRATIONTYPE>Regular</GSTREGISTRATIONTYPE><PARTYGSTIN>${xesc(b.supplierGSTIN)}</PARTYGSTIN>`:`<GSTREGISTRATIONTYPE>Unregistered</GSTREGISTRATIONTYPE>`}${st?`<LEDSTATENAME>${xesc(st)}</LEDSTATENAME><STATENAME>${xesc(st)}</STATENAME>`:''}<COUNTRYNAME>India</COUNTRYNAME></LEDGER></TALLYMESSAGE>\n`; });
  }
  bills.forEach(b=>{
    const v=voucherEntries(b,co); const vt=b.voucherType||co.purchaseVchType||'Purchase';
    const party=b.partyLedger||b.supplierName; const c=billCalc(b);
    const st=STATES[stateOf(b.supplierGSTIN)]||'';
    let le='';
    v.entries.forEach(e=>{
      const isDr=e.dr>0; const a=isDr?-e.dr:e.cr;
      le+=`<ALLLEDGERENTRIES.LIST><LEDGERNAME>${xesc(e.ledger)}</LEDGERNAME><ISDEEMEDPOSITIVE>${isDr?'Yes':'No'}</ISDEEMEDPOSITIVE>${e.party?'<ISPARTYLEDGER>Yes</ISPARTYLEDGER>':''}<AMOUNT>${amt(a)}</AMOUNT>${e.party?`<BILLALLOCATIONS.LIST><NAME>${xesc(b.invoiceNo)}</NAME><BILLTYPE>New Ref</BILLTYPE><AMOUNT>${amt(a)}</AMOUNT></BILLALLOCATIONS.LIST>`:''}</ALLLEDGERENTRIES.LIST>`;
    });
    const narr=`Bill ${b.invoiceNo} dt ${b.invoiceDate} – ${b.supplierName}${b.narration?' – '+b.narration:''} [KAD:${b.id}]`;
    msgs+=`<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="${xesc(vt)}" ACTION="Create" OBJVIEW="Accounting Voucher View"><DATE>${ymd(b.postDate||b.invoiceDate)}</DATE><EFFECTIVEDATE>${ymd(b.postDate||b.invoiceDate)}</EFFECTIVEDATE><VOUCHERTYPENAME>${xesc(vt)}</VOUCHERTYPENAME><REFERENCE>${xesc(b.invoiceNo)}</REFERENCE><REFERENCEDATE>${ymd(b.invoiceDate)}</REFERENCEDATE><PARTYLEDGERNAME>${xesc(party)}</PARTYLEDGERNAME>${b.supplierGSTIN?`<PARTYGSTIN>${xesc(b.supplierGSTIN)}</PARTYGSTIN>`:''}${st?`<STATENAME>${xesc(st)}</STATENAME><PLACEOFSUPPLY>${xesc(STATES[stateOf(co.gstin)]||st)}</PLACEOFSUPPLY>`:''}<PERSISTEDVIEW>Accounting Voucher View</PERSISTEDVIEW><ISINVOICE>No</ISINVOICE><NARRATION>${xesc(narr)}</NARRATION>${le}</VOUCHER></TALLYMESSAGE>\n`;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME><STATICVARIABLES><SVCURRENTCOMPANY>${xesc(co.tallyName||co.name)}</SVCURRENTCOMPANY></STATICVARIABLES></REQUESTDESC><REQUESTDATA>\n${msgs}</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>\n`;
}
// GSTR-2B JSON → flat invoices
function parse2B(j){
  const root=j?.data?.docdata||j?.docdata||j?.data||j; const b2b=root?.b2b||[]; const out=[];
  b2b.forEach(s=>{ (s.inv||[]).forEach(iv=>{ const it=iv.items||iv.itms||[]; let tx=0,ig=0,cg=0,sg=0;
    it.forEach(x=>{const d=x.itm_det||x; tx+=+d.txval||0; ig+=+d.igst||+d.iamt||0; cg+=+d.cgst||+d.camt||0; sg+=+d.sgst||+d.samt||0;});
    if(!it.length){tx=+iv.txval||0; ig=+iv.igst||0; cg=+iv.cgst||0; sg=+iv.sgst||0;}
    out.push({gstin:s.ctin,name:s.trdnm||'',inv:iv.inum,dt:iv.dt,val:+iv.val||0,txval:r2(tx),tax:r2(ig+cg+sg),itcavl:iv.itcavl}); }); });
  return out;
}
function match2B(bills,b2b){
  const key=(g,i)=>String(g||'').toUpperCase()+'|'+invNorm(i);
  const bm=new Map(); bills.forEach(b=>bm.set(key(b.supplierGSTIN,b.invoiceNo),b));
  const matched=[],only2b=[],seen=new Set();
  b2b.forEach(r=>{ const k=key(r.gstin,r.inv); const b=bm.get(k);
    if(b){ seen.add(k); const c=billCalc(b); const diff=r2((c.cgst+c.sgst+c.igst)-r.tax); matched.push({b,r,diff}); } else only2b.push(r); });
  const onlyBooks=bills.filter(b=>b.supplierGSTIN && !seen.has(key(b.supplierGSTIN,b.invoiceNo)));
  return {matched,only2b,onlyBooks};
}
/*CORE-END*/

const Store={mode:'local',db:null,subs:[],mem:{},

  sub(coll,cid,cb){

      let q=this.db.collection(coll); if(cid) q=q.where('cid','==',cid);

  },

async function fileToImagesEx(file){

  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error('PDF reader did not load – check internet once');
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let p=1;p<=Math.min(pdf.numPages,3);p++){ const pg=await pdf.getPage(p); const vp=pg.getViewport({scale:2.2}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); await pg.render({canvasContext:ctx,viewport:vp}).promise;
      out.canvases.push(cv); out.imgs.push(await toJpeg(cv));
      try{ const tc=await pg.getTextContent(); out.text+=tc.items.map(i=>i.str).join(' ')+'\n'; }catch(e){} }
  } else {
    const bmp=await createImageBitmap(file); const sc=Math.min(1,2600/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    out.canvases.push(cv); out.imgs.push(await toJpeg(cv));
  }
  return out;
}

    const tries=[[0,0,cv.width,cv.height]]; const hw=cv.width/2, hh=cv.height/2; [[hw,0],[0,0],[hw,hh],[0,hh]].forEach(([x,y])=>tries.push([x,y,hw,hh]));

function parseBillText(t,c){

  const gst=[...new Set((T.toUpperCase().match(/\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b/g)||[]))].filter(gstinValid);
  const o={supplierGSTIN:gst.find(g=>g!==own)||'',buyerSeen:!own||gst.includes(own)};
  let m=T.match(/(?:tax\s*)?(?:invoice|inv|bill)\s*(?:no|number|num|#)\.?\s*[:\-#.]?\s*([A-Z0-9][A-Z0-9\/\-]{0,24})/i); if(m&&!/^(date|dt|dated)$/i.test(m[1])) o.invoiceNo=m[1];
  m=T.match(/(?:invoice|inv|bill)?\s*(?:date|dated|dt)\s*\.?\s*[:\-]?\s*(\d{1,2}[\/\-. ](?:\d{1,2}|[A-Za-z]{3,9})[\/\-. ,]*\d{2,4})/i); if(m) o.invoiceDate=parseDateIN(m[1]);

}
async function autoRead(ex,c){

    if(qr.buyerGstin&&c.gstin&&qr.buyerGstin!==c.gstin.toUpperCase()) notes.push(`⚠ This e-invoice is addressed to GSTIN ${qr.buyerGstin}, not ${c.gstin} – check the company.`); }

function billTable(list,unapprove,confirm){

async function doExport(){
  const c=co(); const ap=S.bills.filter(b=>b.status==='approved'); if(!ap.length) return;
  const xml=tallyXML(ap,c,S.ledgerSet,{createParties:$('#mkParties')?.checked!==false});
  const stamp=new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
  const fn=`tally_${(c.code||c.short||'CO').replace(/[^A-Za-z0-9]/g,'')}_${stamp}.txt`;
  const res=await saveFile(fn,xml,'Tally import file');
  if(res!=='declined'){ for(const b of ap){ const {id,...rest}=b; await Store.set('bills',b.id,{...rest,status:'sent',sentFile:fn,sentAt:new Date().toISOString()}); } await logIt(`Tally file ${fn}: ${ap.length} voucher(s)`); }
}

function monthPicker(){ return `<label class="row" style="gap:6px"><span class="muted">Month</span><input type="month" id="monthSel" value="${S.month}"></label>`; }
function periodBills(c,ym){ return S.bills.filter(b=>['approved','sent','posted'].includes(b.status)&&String(b.invoiceDate||'').startsWith(ym)); }
function vGST(c){
  if(!c.gstin) return `<div class="card"><h2>GST</h2><p>Add the GSTIN in Company setup to use this tab.</p></div>`;
  const pb=periodBills(c,S.month); const by={};
  pb.forEach(b=>(b.lines||[]).forEach(l=>{ const k=+l.rate||0; const o=by[k]=by[k]||{tx:0,c:0,s:0,i:0,n:0}; o.tx+=+l.taxable||0; o.c+=+l.cgst||0; o.s+=+l.sgst||0; o.i+=+l.igst||0; }));
  const rates=Object.keys(by).sort((a,b)=>a-b); const tot=rates.reduce((o,k)=>({tx:o.tx+by[k].tx,c:o.c+by[k].c,s:o.s+by[k].s,i:o.i+by[k].i}),{tx:0,c:0,s:0,i:0});
  const maxT=Math.max(1,...rates.map(k=>by[k].c+by[k].s+by[k].i));
  const bars=rates.map((k,i)=>{const v=by[k].c+by[k].s+by[k].i; const w=Math.round(520*v/maxT); return `<text x="0" y="${22+i*30}" font-size="14" fill="#141414">${k}%</text><rect x="50" y="${8+i*30}" width="${Math.max(2,w)}" height="20" rx="5" fill="#FFB86E" stroke="#C2560C"/><text x="${58+w}" y="${23+i*30}" font-size="13" fill="#141414">₹${fmt(v)}</text>`;}).join('');

  let mt='';
  if(S.b2b){ const r=match2B(pb,S.b2b);
    mt=`<div class="grid3" style="margin:8px 0"><div class="kpi" style="background:var(--okbg)"><b>${r.matched.length}</b><span>Matched with 2B</span></div><div class="kpi" style="background:var(--badbg)"><b>${r.onlyBooks.length}</b><span>In books, not in 2B (ITC at risk)</span></div><div class="kpi" style="background:var(--warnbg)"><b>${r.only2b.length}</b><span>In 2B, not in books</span></div></div>
    ${r.onlyBooks.length?`<h3>In books, not in 2B – follow up with supplier</h3>${miniTable(r.onlyBooks.map(b=>[b.supplierName,b.supplierGSTIN,b.invoiceNo,b.invoiceDate,fmt((c=>c.cgst+c.sgst+c.igst)(billCalc(b)))]),['Supplier','GSTIN','Invoice','Date','GST'])}`:''}
    ${r.only2b.length?`<h3 style="margin-top:10px">In 2B, not in books – missing bill?</h3>${miniTable(r.only2b.map(x=>[x.name,x.gstin,x.inv,x.dt,fmt(x.tax)]),['Supplier','GSTIN','Invoice','Date','GST'])}`:''}
    ${r.matched.filter(x=>Math.abs(x.diff)>1).length?`<h3 style="margin-top:10px">Amount differences</h3>${miniTable(r.matched.filter(x=>Math.abs(x.diff)>1).map(x=>[x.b.supplierName,x.b.invoiceNo,fmt(x.diff)]),['Supplier','Invoice','Books − 2B GST'])}`:''}`;
  }
  return `<div class="card"><div class="billhead"><h2>GST – ${esc(c.short||c.name)}</h2>${monthPicker()}</div><p class="muted">${esc(c.gstin)} · ${c.gstFreq==='qrmp'?'Quarterly (QRMP)':'Monthly'} filer · purchases from bills approved in this app</p></div>
  <div class="card"><h3>Input tax credit from bills – ${S.month}</h3>${rates.length?`<svg viewBox="0 0 760 ${rates.length*30+10}" width="100%">${bars}</svg>
   <div class="tw"><table><tr><th>GST rate</th><th class="n">Taxable</th><th class="n">CGST</th><th class="n">SGST</th><th class="n">IGST</th></tr>${rates.map(k=>`<tr><td>${k}%</td><td class="n">${fmt(by[k].tx)}</td><td class="n">${fmt(by[k].c)}</td><td class="n">${fmt(by[k].s)}</td><td class="n">${fmt(by[k].i)}</td></tr>`).join('')}<tr><th>Total (${pb.length} bills)</th><th class="n">${fmt(tot.tx)}</th><th class="n">${fmt(tot.c)}</th><th class="n">${fmt(tot.s)}</th><th class="n">${fmt(tot.i)}</th></tr></table></div>

function miniTable(rows,heads){ return `<div class="tw"><table><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`; }

function vTDS(c){
  if(!c.tan) return `<div class="card"><h2>TDS</h2><p>Add the TAN in Company setup to use this tab.</p></div>`;
  const pb=periodBills(c,S.month).filter(b=>b.tds&&b.tds.on);
  const bySec={}; pb.forEach(b=>{const k=b.tds.section||'(no section)'; const t=billCalc(b).tds; const o=bySec[k]=bySec[k]||{n:0,base:0,tds:0}; o.n++; o.base+=+b.tds.base||billCalc(b).taxable; o.tds+=t;});
  const tot=Object.values(bySec).reduce((s,o)=>s+o.tds,0);
  const [y,m]=S.month.split('-').map(Number); const nx=m===12?[y+1,1]:[y,m+1];
  const tasks=[...dueTasks(c,nx[0],nx[1]),...dueTasks(c,y,m)].filter(t=>t.kind==='tds').map(t=>({...t,st:S.tasks[t.key]||null}));
  const uniq=[...new Map(tasks.map(t=>[t.key,t])).values()];
  return `<div class="card"><div class="billhead"><h2>TDS – ${esc(c.short||c.name)}</h2>${monthPicker()}</div><p class="muted">TAN ${esc(c.tan)} · from bills approved in this app. Salary TDS is not covered here – take it from payroll.</p></div>

   ${miniTable(pb.map(b=>{const k=billCalc(b); return [b.invoiceDate,b.supplierName,b.supplierGSTIN?b.supplierGSTIN.slice(2,12):'(PAN?)',b.tds.section,fmt(+b.tds.base||k.taxable),b.tds.rate+'%',fmt(k.tds)];}),['Date','Party','PAN (from GSTIN)','Section','Amount paid/credited','Rate','TDS'])}
   <p class="muted">PAN is taken from characters 3–12 of the GSTIN. For parties without GSTIN, get the PAN separately.</p><div class="row"><button data-act="tdsCsv">Download TDS register (CSV)</button><button data-act="tdsQCsv">Download quarter register (CSV)</button></div>`:'<p class="muted">No bills with TDS this month.</p>'}</div>
  <div class="card"><h3>TDS deposit &amp; returns</h3>${uniq.map(t=>taskRow(t,c)).join('')||'<p class="muted">None this period.</p>'}<p class="muted">From 1 April 2026 the Income-tax Act, 2025 applies: quarterly returns are on Form 140 (non-salary) and Form 138 (salary) with new section references. Returns for periods before April 2026 stay on 26Q/24Q.</p></div>`;
}

// ---------- calendar ----------
function vCal(){
  const [y,m]=S.month.split('-').map(Number);
  const rows=S.companies.flatMap(cmp=>dueTasks(cmp,y,m).filter(t=>t.dueISO>=(cmp.trackFrom||'')).map(t=>{ const st=taskStatus(cmp.id,t); if(st&&st.dueOverride) t.dueOverride=st.dueOverride; return {t:{...t,st},cmp}; })).sort((a,b)=>(a.t.dueOverride||a.t.dueISO).localeCompare(b.t.dueOverride||b.t.dueISO));
  const days=new Date(y,m,0).getDate(); const first=new Date(y,m-1,1).getDay();
  let cells=''; for(let i=0;i<first;i++) cells+='<div></div>';
  for(let d=1;d<=days;d++){ const iso=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const here=rows.filter(r=>(r.t.dueOverride||r.t.dueISO)===iso); const allDone=here.length&&here.every(r=>r.t.st&&r.t.st.status==='filed');
    cells+=`<div style="min-height:54px;border:2px solid var(--line);border-radius:8px;padding:3px 5px;background:${here.length?(allDone?'var(--okbg)':'var(--accent2)'):'#FFFDF9'}"><b>${d}</b>${here.length?`<div style="font-size:11px">${here.map(r=>esc((r.cmp.short||'').slice(0,6)+' '+r.t.title.split(' ')[0])).join('<br>')}</div>`:''}</div>`; }
  return `<div class="card"><div class="billhead"><h2>Compliance calendar</h2>${monthPicker()}</div><p class="muted">All companies. Orange = something due, green = all filed.</p>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${cells}</div></div>
  <div class="card"><h3>Due in ${S.month}</h3>${rows.length?rows.map(r=>taskRow(r.t,r.cmp)).join(''):'<p class="muted">Nothing due.</p>'}</div>`;
}

function onCoInput(el){ const path=el.dataset.co.split('.'); let o=S.coDraft; for(let i=0;i<path.length-1;i++){ o[path[i]]=o[path[i]]||{}; o=o[path[i]]; } let v=el.value; if(['tallyPort','qrmpDay'].includes(path[0])&&v!=='') v=+v; if(path[path.length-1]==='rate') v=+v||0; if(path[0]==='gstin'||path[0]==='tan') v=String(v).toUpperCase().trim(); o[path[path.length-1]]=v; if(el.tagName==='SELECT'||path[0]==='gstin') render(); }
async function saveLedgers(names){
  const c=co(); names=[...new Set(names.map(s=>String(s).trim()).filter(Boolean))];
  const old=await Store.get('ledgers',c.id+'_0'); // chunk docs of 2500 names
  for(let i=0;i<Math.max(1,Math.ceil(names.length/2500));i++) await Store.set('ledgers',`${c.id}_${i}`,{cid:c.id,names:names.slice(i*2500,(i+1)*2500),at:new Date().toISOString()});
  for(let i=Math.ceil(names.length/2500);i<20;i++){ const ex=await Store.get('ledgers',`${c.id}_${i}`); if(!ex) break; await Store.del('ledgers',`${c.id}_${i}`); }
  toast(`${names.length} ledgers saved`); await logIt(`Ledger list loaded (${names.length})`);
}
function parseLedgerFile(name,buf,text){
  if(/\.xlsx?$/i.test(name)&&window.XLSX){ const wb=XLSX.read(buf,{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}); return pickNameCol(rows); }
  if(/<LEDGER/i.test(text)){ return [...text.matchAll(/<LEDGER[^>]*NAME="([^"]+)"/gi)].map(m=>m[1].replace(/&amp;/g,'&')); }
  const rows=text.split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"')));
  return pickNameCol(rows);
}
function pickNameCol(rows){ if(!rows.length) return []; const h=(rows[0]||[]).map(x=>String(x||'').toLowerCase()); let ci=h.findIndex(x=>/name|particulars|ledger/.test(x)); const start=ci>=0?1:0; if(ci<0) ci=0; return rows.slice(start).map(r=>r&&r[ci]).filter(x=>x&&String(x).trim()); }

  else { const keep={...c,...cs,name:c.name,id:undefined}; delete keep.id; await Store.set('companies',c.id,keep); }

  for(const d of j.adjs||[]){ const {id,...rest}=d; await Store.set('adj',id||uid(),{...rest,cid}); }
  if(j.ledgers?.length) await saveLedgers(j.ledgers);
  toast(`Backup restored – ${(j.bills||[]).length} bills, ${(j.stmts||[]).reduce((n,d)=>n+(d.txns||[]).length,0)} bank entries`,4000); render(); }catch(x){ console.error(x); toast('Could not read backup'); } };

<script>
/*CORE2-START*/
// ---------- bank & accounts: pure helpers ----------
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function fmtYMD(y,m,d){ if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>1990&&y<2100)) return ''; return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function parseDateIN(v){
  if(v==null||v==='') return '';
  if(typeof v==='number'&&v>20000&&v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return fmtYMD(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); }
  if(v instanceof Date&&!isNaN(v)) return fmtYMD(v.getFullYear(),v.getMonth()+1,v.getDate());
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return fmtYMD(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})\b/))){ let y=+m[3]; if(y<100) y+=2000; return fmtYMD(y,+m[2],+m[1]); }
  if((m=s.match(/^(\d{1,2})[\/\-. ]?([A-Za-z]{3,4})[A-Za-z]*[\/\-. ,]*(\d{2,4})\b/))&&MON[m[2].toLowerCase()]){ let y=+m[3]; if(y<100) y+=2000; return fmtYMD(y,MON[m[2].toLowerCase()],+m[1]); }
  return '';
}
const num=v=>{ if(typeof v==='number') return v; let s=String(v??'').replace(/[,₹\s]/g,''); const neg=/^\(.*\)$/.test(s)||/dr$/i.test(s); s=s.replace(/[()]/g,'').replace(/(cr|dr)$/i,''); const n=parseFloat(s); return isNaN(n)?0:(neg?-Math.abs(n):n); };
function detectCols(rows){
  for(let i=0;i<Math.min(rows.length,40);i++){
    const h=(rows[i]||[]).map(x=>String(x??'').toLowerCase().replace(/\s+/g,' ').trim());
    const find=(re,not)=>h.findIndex(x=>re.test(x)&&!(not&&not.test(x)));
    const date=find(/date/,/value date/)>=0?find(/date/,/value date/):find(/date/);
    const narr=find(/narration|description|particulars|remarks|details/);
    if(date<0||narr<0) continue;
    const dr=find(/withdraw|debit|^dr\.?$|paid out/), cr=find(/deposit|credit|^cr\.?$|paid in/), bal=find(/balance/), ref=find(/chq|cheque|ref/,/narration|description|particulars/), amt=find(/amount/), typ=find(/dr\s*\/\s*cr|cr\s*\/\s*dr|^type$/);
    if((dr>=0&&cr>=0)||(amt>=0&&typ>=0)) return {head:i,date,narr,dr,cr,bal,ref,amt,typ};
  }
  return null;
}
function rowsToTxns(rows,map){
  const out=[];
  for(let i=map.head+1;i<rows.length;i++){ const r=rows[i]||[]; const date=parseDateIN(r[map.date]); if(!date) continue;
    let dr=0,cr=0;
    if(map.dr>=0&&map.cr>=0){ dr=Math.abs(num(r[map.dr])); cr=Math.abs(num(r[map.cr])); }
    else { const a=Math.abs(num(r[map.amt])); if(/d/i.test(String(r[map.typ]))) dr=a; else cr=a; }
    if(!dr&&!cr) continue;
    out.push({date,narr:String(r[map.narr]??'').replace(/\s+/g,' ').trim(),ref:map.ref>=0?String(r[map.ref]??'').trim():'',dr:r2(dr),cr:r2(cr),bal:map.bal>=0&&r[map.bal]!==''&&r[map.bal]!=null?r2(num(r[map.bal])):null});
  }
  return out;
}
// Running-balance check: flags rows where previous balance − withdrawal + deposit ≠ balance.
function balanceBreaks(txns){
  const bad=[]; let dir=0;
  for(let i=1;i<txns.length;i++){ const a=txns[i-1],b=txns[i]; if(a.bal==null||b.bal==null) continue;
    const fwd=Math.abs(r2(a.bal-b.dr+b.cr)-b.bal)<0.02, rev=Math.abs(r2(b.bal-a.dr+a.cr)-a.bal)<0.02;
    if(!dir){ if(fwd) dir=1; else if(rev) dir=-1; }
    if(dir===1&&!fwd||dir===-1&&!rev||(!dir&&!fwd&&!rev)) bad.push(i); }
  return bad;
}
function txnHash(t){ return [t.date,r2(t.dr),r2(t.cr),norm(t.narr).slice(0,40),t.bal==null?'':r2(t.bal)].join('|'); }
function hashId(s){ let h1=0x811c9dc5,h2=0; for(let i=0;i<s.length;i++){ h1=Math.imul(h1^s.charCodeAt(i),16777619)>>>0; h2=(h2*31+s.charCodeAt(i))>>>0; } return h1.toString(36)+h2.toString(36); }
function firstTdsLedger(co){ const v=Object.values(co.tdsMap||{}); return (v[0]&&v[0].ledger)||'TDS Payable'; }
function classifyTxn(t,ctx){
  const co=ctx.co, n=String(t.narr||'').toUpperCase(), dr=t.dr>0;
  const res=(ledger,kind,reason,extra={})=>({ledger,kind,reason,vtype:kind==='contra'?(co.contraVchType||'Contra'):dr?(co.paymentVchType||'Payment'):(co.receiptVchType||'Receipt'),billId:'',billRef:'',...extra});
  for(const r of (co.bankRules||[])) if(r.k&&n.includes(String(r.k).toUpperCase())&&(!r.dir||r.dir===(dr?'dr':'cr'))) return res(r.ledger,r.kind||'rule',`Your rule: “${r.k}”`);
  for(const b of (ctx.banks||[])) if(b.ledger!==ctx.bank&&b.last4&&new RegExp('\\b\\d*'+b.last4+'\\b').test(n)) return res(b.ledger,'contra','Transfer with own account …'+b.last4);
  if(dr&&/ITNS\s*-?\s*281|\bTDS\b|TDS\/TCS|\b281\b/.test(n)) return res(co.tdsChallanLedger||firstTdsLedger(co),'tds','Looks like a TDS challan');
  if(dr&&/CBDT|OLTAS|INCOME\s*TAX|ITNS|E-?PAY\s*TAX/.test(n)) return res(co.advTaxLedger||'Advance Tax','itax','Looks like an income-tax payment');

function splitCsv(l){ const out=[]; let cur='',q=false; for(let i=0;i<l.length;i++){ const ch=l[i]; if(q){ if(ch==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; } else if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); }
function cashFlow(cur,prev){

    if(r.primary===PG.cl) return wc.push([{'Sundry Creditors':'Increase/(decrease) in trade payables','Duties & Taxes':'Increase/(decrease) in GST/TDS & other duties payable','Provisions':'Increase/(decrease) in provisions'}[r.sub]||'Increase/(decrease) in other current liabilities',eff]);

async function readStatementFile(f){
  const prog=m=>{ const el=$('#stmtProg'); if(el) el.textContent=m; };
  const c=co(); let txns=[], note='';
  if(/\.(csv|txt|xlsx|xls)$/i.test(f.name)){
    if(!window.XLSX) throw new Error('Spreadsheet reader did not load – check internet');
    const wb=/\.(csv|txt)$/i.test(f.name)?XLSX.read(await f.text(),{type:'string',raw:true}):XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    for(const sn of wb.SheetNames){ const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}); const map=detectCols(rows); if(map){ txns=rowsToTxns(rows,map); break; } }
    if(!txns.length) throw new Error('Could not find Date / Narration / Withdrawal / Deposit columns');
  } else {
    if(!Store.ai||!Store.aiImages) throw new Error('PDF/photo reading needs the online app – use the Excel/CSV statement');
    let pages=[];
    if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){ const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; const n=Math.min(pdf.numPages,30); if(pdf.numPages>30) note=' (first 30 pages only)';
      for(let p=1;p<=n;p++){ prog(`Preparing page ${p}/${n}…`); const pg=await pdf.getPage(p); const vp=pg.getViewport({scale:2}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; pages.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85))); } }
    else pages=await fileToImages(f);
    for(let i=0;i<pages.length;i+=2){ prog(`AI reading pages ${i+1}-${Math.min(i+2,pages.length)} of ${pages.length}…`);
      const res=await Store.ai(`Extract every transaction row from these bank/card/loan statement page(s) for "${c.name}". Reply with ONLY JSON:
{"accountLast4":"","txns":[{"date":"YYYY-MM-DD","narration":"","ref":"","withdrawal":0,"deposit":0,"balance":0}]}
Rules: Indian dates are day-month-year. Copy the narration exactly. Amounts are plain numbers. Skip opening balance, closing balance, totals and page headers. Keep the statement order. If balance is missing use null.`,{images:pages.slice(i,i+2),modelTier:'default'});
      const t=res.text||''; const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
      const acc=String(j.accountLast4||''); const b=(c.banks||[]).find(x=>x.ledger===S.bankSel); if(acc&&b&&b.last4&&!acc.endsWith(b.last4)) note+=` · ⚠ statement shows account …${acc}, selected …${b.last4}`;
      (j.txns||[]).forEach(x=>{ const date=parseDateIN(x.date); if(date) txns.push({date,narr:String(x.narration||'').trim(),ref:String(x.ref||''),dr:r2(Math.abs(num(x.withdrawal))),cr:r2(Math.abs(num(x.deposit))),bal:x.balance==null||x.balance===''?null:r2(num(x.balance))}); }); }
  }
  return {txns:txns.filter(t=>t.dr||t.cr),note};
}
async function importStatement(f){
  const c=co(); const prog=m=>{ S.stmtMsg=m; const el=$('#stmtProg'); if(el) el.textContent=m; };
  try{
    prog('Reading '+f.name+'…'); const {txns,note}=await readStatementFile(f);
    const breaks=new Set(balanceBreaks(txns));
    const existing=allTx(S.bankSel); const seen=new Set(existing.map(t=>t.h));
    const ctx={co:c,bank:S.bankSel,banks:c.banks||[],bills:S.bills,ledgers:S.ledgers,usedBills:new Set(existing.filter(t=>t.billId).map(t=>t.billId))};
    let added=0,dup=0; const months=new Set(); let seq=Date.now();
    txns.forEach((t,i)=>{ const h=txnHash(t); if(seen.has(h)){dup++; return;} seen.add(h);
      const cl=classifyTxn(t,ctx); existing.push({...t,...cl,h,id:hashId(h),seq:seq++,status:'new',flag:breaks.has(i)?'Balance does not follow from the previous line – check amount':''}); months.add(t.date.slice(0,7)); added++; });
    await saveMonths(S.bankSel,[...months],existing);
    const first=[...months].sort()[0]; if(first&&!months.has(S.month)) S.month=first;
    prog(`${added} new entries, ${dup} already there${breaks.size?`, ${breaks.size} balance mismatch(es) flagged`:''}${note}`);
    await logIt(`Bank statement ${f.name} → ${S.bankSel}: ${added} new`); render();
  }catch(e){ prog('✖ '+(e.code==='rate_limited'?'AI busy – try again in a minute':e.message||e)); }
}

function helpFor(el){
  if(!el||el===document.body) return '';
  if(el.dataset){
    if(el.dataset.help) return el.dataset.help;
    if(el.dataset.tab) return HELP['tab:'+el.dataset.tab]||'';
    if(el.dataset.k) return HELP['k:'+el.dataset.k]||'';
    if(el.dataset.co){ const k=el.dataset.co.split('.')[0]; return HELP['co:'+(k==='rateLedgers'||k==='tdsMap'?k:el.dataset.co)]||''; }
    if(el.dataset.tx) return HELP.tx;
    if(el.dataset.act) return HELP['a:'+el.dataset.act]||'';
  }
  if(el.id&&HELP[el.id]) return HELP[el.id];
  const lab=el.closest&&el.closest('label'); if(lab){ const t=(lab.childNodes[0]&&lab.childNodes[0].textContent||'').trim(); if(t) return `${t}: fill this in.`; }
  return '';
}

function deviceNote(){
  if(Store.mode==='cloud') return `<div class="devnote cloud"><svg width="42" height="34" viewBox="0 0 42 34"><path d="M10 28h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2A8 8 0 0 0 10 28z" fill="#A9C3EE" stroke="#123C73" stroke-width="2"/></svg><div><b>Your data is saved online in your claude.ai account.</b> It appears on every device where you open this app, and to people you share the app with.</div></div>`;
  return `<div class="devnote local"><svg width="42" height="38" viewBox="0 0 42 38"><rect x="3" y="3" width="36" height="24" rx="3" fill="#FFE2C2" stroke="#7A4A00" stroke-width="2.5"/><path d="M14 35h14M21 27v8" stroke="#7A4A00" stroke-width="2.5"/><rect x="16" y="9" width="10" height="9" rx="2" fill="#7A4A00"/><path d="M18 9V7a3 3 0 0 1 6 0v2" stroke="#7A4A00" stroke-width="2" fill="none"/></svg><div><b>Your data stays only on this device – the one you entered it on.</b> Entries made on this PC are only on this PC; entries made on your phone are only on that phone. Nothing is sent to other devices or stored online. Clearing browser data deletes it – <a href="#company" data-tab="company">download a backup</a> every week.</div></div>`;
}
const _render=render;
render=function(){ _render(); const m=$('#main'); if(m&&!m.querySelector('.devnote')&&!(S.editing&&m.contains(document.activeElement))) m.insertAdjacentHTML('afterbegin',deviceNote()); };

// Guide tab
function chain(labels){ const w=130; return `<svg viewBox="0 0 ${labels.length*w+10} 92" width="100%" style="max-width:${labels.length*w+10}px">${labels.map((l,i)=>`<circle cx="${i*w+30}" cy="30" r="22" fill="${i===labels.length-1?'#DDF3E3':'#FFCF9E'}" stroke="#C2560C" stroke-width="2.5"/><text x="${i*w+30}" y="38" font-size="22" text-anchor="middle">${l[0]}</text>${i<labels.length-1?`<path d="M${i*w+54} 30 h${w-50}" stroke="#C2560C" stroke-width="3"/>`:''}<text x="${i*w+30}" y="78" font-size="11.5" text-anchor="middle" fill="#141414">${esc(l[1])}</text>`).join('')}</svg>`; }

function vGuide(){
  return `<div class="card"><h2>Guide – how to use each feature</h2><ul class="tight muted"><li>Follow the sections in order the first time.</li><li>Point at or tap any box or button – the <b>help strip</b> at the bottom says what to do there. Turn on <b>🔊 Read aloud</b> to hear it.</li><li>Click <b>Go there</b> to open that screen.</li></ul></div>`+
  GUIDE.map(g=>`<div class="card gsec"><div class="billhead"><h3>${g.t}</h3><button class="small primary" data-tab="${g.tab}" data-help="Open the ${esc(g.t.replace(/^\d+\.\s*/,''))} screen.">Go there →</button></div><div class="gpic">${chain(g.pic)}</div><ol class="gsteps">${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`).join('');
}

(async()=>{
  const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)) S.tab=h;
  render(); await Store.init(); subscribeAll(); render();
})();
